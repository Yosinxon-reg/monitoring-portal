  <style>
:root {
  --bg: #f3f7fc;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --text: #16202e;
  --muted: #5d6b7e;
  --brand: #066ecf;
  --brand-ink: #ffffff;
  --brand-soft: #e6f1fb;
  --brand-dark: #04549f;
  --side: #066ecf;
  --side-text: #e3efff;
  --side-active: rgba(255, 255, 255, .16);
  --ok: #16834a;   --ok-soft: #e4f6ec;
  --warn: #b26b00; --warn-soft: #fff3dc;
  --bad: #c4312b;  --bad-soft: #fde8e7;
  --info: #3d5af1; --info-soft: #eaeeff;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1420; --surface: #141d2b; --surface-2: #192335; --border: #263247;
    --text: #e6ecf5; --muted: #95a3b8; --brand: #3d95ea; --brand-soft: #12304f;
    --side: #053f78; --side-active: rgba(255,255,255,.12);
    --ok-soft: #12301f; --warn-soft: #33270f; --bad-soft: #3a1717; --info-soft: #1b2448;
    --ok: #4cc685; --warn: #f0b04a; --bad: #ff7a72; --info: #8ea2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1420; --surface: #141d2b; --surface-2: #192335; --border: #263247;
  --text: #e6ecf5; --muted: #95a3b8; --brand: #3d95ea; --brand-soft: #12304f;
  --side: #053f78; --side-active: rgba(255,255,255,.12);
  --ok-soft: #12301f; --warn-soft: #33270f; --bad-soft: #3a1717; --info-soft: #1b2448;
  --ok: #4cc685; --warn: #f0b04a; --bad: #ff7a72; --info: #8ea2ff;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--brand); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.boot { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- Buttons & form ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
textarea { min-height: 84px; resize: vertical; }
.field { margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-side { background: linear-gradient(160deg, #066ecf, #04549f); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login-side h1 { font-size: 30px; margin-top: 18px; }
.login-side p { color: var(--side-text); max-width: 440px; }
.login-main { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-size: 22px; margin-bottom: 6px; }
.demo-box { margin-top: 22px; padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; }
.demo-box button { margin: 3px 3px 0 0; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 700; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.sidebar { background: linear-gradient(180deg, var(--side), var(--brand-dark, #04549f)); color: var(--side-text); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar .logo { color: #fff; padding: 0 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: var(--side-text); text-decoration: none; padding: 9px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-weight: 500; }
.nav a:hover { background: var(--side-active); color: #fff; }
.nav a.active { background: #fff; color: var(--brand); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.nav a.active .badge { background: var(--brand); color: #fff; }
.nav .badge { margin-left: auto; background: #fff; color: var(--brand); font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 99px; }
.about-mini { margin-top: auto; border-top: 1px solid rgba(255,255,255,.25); padding-top: 14px; font-size: 13px; }
.about-mini .name { color: #fff; font-weight: 600; }
.about-mini a { color: #fff; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center;
  font-weight: 700; flex: none; object-fit: cover; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; }
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--surface); border-bottom: 3px solid var(--brand); position: sticky; top: 0; z-index: 5; }
.topbar .menu-btn { display: none; }
.content { padding: 24px 28px 48px; max-width: 1200px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.demo-banner { background: var(--warn-soft); color: var(--warn); padding: 8px 28px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card + .card, .stack > * + * { margin-top: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat .v { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stat .l { color: var(--muted); font-size: 13px; font-weight: 500; }
.stat.bad .v { color: var(--bad); } .stat.ok .v { color: var(--ok); } .stat.warn .v { color: var(--warn); }
.cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.cols > .card { margin-top: 0; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }

/* ---------- Tables & lists ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item.click { cursor: pointer; }
.list-item.click:hover { background: var(--surface-2); margin: 0 -10px; padding: 12px 10px; border-radius: 8px; }
.list-item .t { font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.yangi, .pill.yuborildi { background: var(--info-soft); color: var(--info); }
.pill.jarayonda { background: var(--warn-soft); color: var(--warn); }
.pill.bajarildi { background: var(--brand-soft); color: var(--brand); }
.pill.yopildi, .pill.tasdiqlandi { background: var(--ok-soft); color: var(--ok); }
.pill.qaytarildi, .pill.overdue, .pill.yuqori, .pill.missing { background: var(--bad-soft); color: var(--bad); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
.filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.filters select, .filters input { width: auto; min-width: 150px; }
.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 80px; }
.progress > i { display: block; height: 100%; background: var(--ok); }
.report-body dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 12px; }
.report-body dd { margin: 3px 0 0; white-space: pre-wrap; }
.note { background: var(--surface-2); border-left: 3px solid var(--brand); padding: 8px 12px; border-radius: 6px; margin-top: 10px; white-space: pre-wrap; }
.note.bad { border-left-color: var(--bad); }

/* ---------- About ---------- */
.about-full { display: flex; gap: 22px; align-items: flex-start; }
.about-full .bio { white-space: pre-wrap; margin-top: 10px; }
.soon { opacity: .9; }
.soon .pill { margin-left: auto; }

/* ---------- KPI ---------- */
.kpi-table th { text-align: center; white-space: nowrap; }
.kpi-table th:first-child { text-align: left; }
.kpi-table td { text-align: center; }
.kpi-table td:first-child { text-align: left; white-space: nowrap; }
.kpi-max { font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.kpi-in { width: 64px; padding: 5px 6px; text-align: center; }
.kpi-in::placeholder { color: var(--muted); opacity: .9; }
.kpi-in.set { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.kpi-auto { color: var(--muted); }
.top-card { background: linear-gradient(135deg, var(--surface), var(--warn-soft)); }
.top-item { display: flex; gap: 12px; align-items: center; min-width: 220px; }
.top-score { font-size: 22px; font-weight: 700; color: var(--warn); }

/* ---------- KPI rejimlari, reja ---------- */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.seg button.active { background: var(--brand); color: #fff; }
tr.picked td { background: var(--warn-soft); }
.plan-in { min-height: 70px; font-size: 14px; }
.plan-table td { vertical-align: top; }

/* ---------- Hisobot eslatmasi ---------- */
.due-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 28px; font-weight: 500; }
.due-banner.due { background: var(--warn-soft); color: var(--warn); }
.due-banner.late { background: var(--bad-soft); color: var(--bad); }
.due-banner .btn { margin-left: auto; }
@media (max-width: 760px) { .due-banner { padding: 10px 16px; } }

/* ---------- Ma'lumotnoma ---------- */
.staff-photo { width: 150px; border-radius: 50%; flex: none; object-fit: cover; aspect-ratio: 1/1; border: 4px solid var(--brand-soft); }
.info-lines { white-space: pre-wrap; font-size: 14px; line-height: 1.7; }

/* ---------- Videolar ---------- */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.video-card { text-align: left; padding: 0; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); overflow: hidden; cursor: pointer; font: inherit; color: var(--text); box-shadow: var(--shadow); }
.video-card:hover { border-color: var(--brand); }
.video-thumb { aspect-ratio: 16/9; background: linear-gradient(135deg, #1c2c46, #1f5eff); position: relative; display: grid; place-items: center; }
.video-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video-thumb .play { position: relative; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.92); color: #1f5eff; display: grid; place-items: center; font-size: 20px; padding-left: 4px; }
.video-meta { padding: 12px 14px; }
.video-meta .t { font-weight: 600; }
.video-player { aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 12px; display: grid; place-items: center; }
.video-player video, .video-player iframe { width: 100%; height: 100%; border: 0; }
.video-player .empty { color: #ccc; }

/* ---------- Masalalar ---------- */
.posts-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.cat-list { padding: 8px; position: sticky; top: 80px; }
.cat-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px; border-radius: 8px; font: inherit; color: var(--text); cursor: pointer; text-align: left; }
.cat-row:hover { background: var(--surface-2); }
.cat-row.active { background: var(--brand-soft); font-weight: 600; }
.cat-dot { border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 14px; width: 30px; height: 30px; }
@media (max-width: 760px) {
  .posts-layout { grid-template-columns: 1fr; }
  .cat-list { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .cat-row { width: auto; white-space: nowrap; flex: none; }
}

/* ---------- Modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 26, .5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); margin-left: auto; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px); background: var(--text); color: var(--bg); padding: 10px 18px;
  border-radius: 10px; font-weight: 500; transition: transform .25s, opacity .25s; z-index: 60; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.err { background: var(--bad); color: #fff; }
.err-text { color: var(--bad); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .login-wrap { grid-template-columns: 1fr; }
  .login-side { padding: 28px 16px; }
  .login-side h1 { font-size: 24px; }
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .topbar { padding: 12px 16px; }
  .topbar .menu-btn { display: inline-flex; }
  .content { padding: 18px 16px 40px; }
  .demo-banner { padding: 8px 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .about-full { flex-direction: column; }
  .hide-sm { display: none; }
  .filters select, .filters input { flex: 1; min-width: 0; }
}

.lesson-card { text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--brand); border-radius: var(--radius); padding: 14px; cursor: pointer; box-shadow: var(--shadow); }

/* ---- 13: kunlik reja, baholar, oxirgi faollik ---- */
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }

.grade-pick button:hover { border-color: var(--brand); }
.grade-pick button.on { background: var(--brand); border-color: var(--brand); color: #fff; }

.staff-band label { color: var(--text); }

.rc-done { font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
.rc-note { font-size: 13px; margin-top: 8px; background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; }
.rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.rep-card { margin: 0; }

.rep-card.done { border-left: 4px solid var(--ok); }

.today-plan { background: var(--brand-soft); border-left: 4px solid var(--brand); border-radius: 10px; padding: 12px 14px; font-size: 15px; white-space: pre-wrap; }
.week-mini { display: grid; gap: 4px; }
.week-mini .wm { display: flex; gap: 10px; font-size: 13px; padding: 6px 8px; border-radius: 8px; }

.week-mini .wm.today b { color: var(--brand); }

.level-box { display: flex; align-items: center; gap: 16px; padding: 6px 0 12px; }

.plan-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.plan-day { border: 1px solid var(--border); border-radius: 12px; padding: 10px; }

.due-banner.plan { background: var(--brand-soft); border-color: var(--brand); color: var(--text); }
.due-banner span { flex: 1; }

/* =============================================================
   PREMIUM KO'RINISH (2026-10-25)
   ============================================================= */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f6f8fc; --border: #e4e9f2; --border-strong: #cfd8e6;
  --text: #0f1b2d; --muted: #5b6b82;
  --brand: #0b63ce; --brand-dark: #08479a; --brand-soft: #e8f1fd;
  --side: #0b1f3a; --side-2: #0f2d57; --side-text: #b9c7dc; --side-active: rgba(255,255,255,.08);
  --gold: #c99a2e; --gold-soft: #fbf3df;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 27, 45, .04), 0 4px 14px rgba(15, 27, 45, .05);
  --shadow-lg: 0 10px 30px rgba(15, 27, 45, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111c; --surface: #121a28; --surface-2: #172133; --border: #222e43; --border-strong: #33425c;
    --text: #e8eef7; --muted: #9aa9bf; --brand: #4b9bf0; --brand-dark: #2f7fd6; --brand-soft: #14304f;
    --side: #08101d; --side-2: #0c1a30; --gold: #e2b955; --gold-soft: #33290f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --shadow-lg: 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg: #0b111c; --surface: #121a28; --surface-2: #172133; --border: #222e43; --border-strong: #33425c;
  --text: #e8eef7; --muted: #9aa9bf; --brand: #4b9bf0; --brand-dark: #2f7fd6; --brand-soft: #14304f;
  --side: #08101d; --side-2: #0c1a30; --gold: #e2b955; --gold-soft: #33290f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --shadow-lg: 0 10px 30px rgba(0,0,0,.45);
}
body { font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; } h2 { font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
.page-head h1, .page-head h1 { color: var(--text); }
.page-head { margin-bottom: 22px; }

/* Buttons */
.btn { border-radius: 10px; font-weight: 600; transition: border-color .15s, background .15s, box-shadow .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #1673e0, var(--brand)); border-color: var(--brand); box-shadow: 0 1px 2px rgba(11,99,206,.3), inset 0 1px 0 rgba(255,255,255,.15); }
.btn.max-btn { background: linear-gradient(180deg, #f6d77a, #e7b742); border-color: #d9a630; color: #3d2a00; font-weight: 700; }
.btn.max-btn:hover { filter: brightness(1.04); border-color: #b9861a; }
.btn.max-btn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
input, select, textarea { border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

/* Sidebar */
.shell { grid-template-columns: 264px 1fr; }
.sidebar { background: linear-gradient(180deg, var(--side) 0%, var(--side-2) 100%); padding: 20px 14px 16px; gap: 14px; border-right: 1px solid rgba(255,255,255,.04); }
.sidebar .brand { padding: 4px 8px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.nav { gap: 1px; }
.nav-sec { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(185,199,220,.55); padding: 14px 12px 6px; }
.nav-sec:first-child { padding-top: 2px; }
.nav a { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; color: var(--side-text); }
.nav a svg { opacity: .8; }
.nav a:hover { background: var(--side-active); color: #fff; }
.nav a.active { background: rgba(75,155,240,.16); color: #fff; box-shadow: none; }
.nav a.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #4b9bf0; }
.nav a.active svg { opacity: 1; color: #7bb8f7; }
.nav .badge { background: #e5484d; color: #fff; }
.nav a.active .badge { background: #e5484d; color: #fff; }
.me-mini { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); text-decoration: none; }
.me-mini:hover { background: rgba(255,255,255,.09); }
.me-mini .avatar { width: 36px; height: 36px; background: rgba(255,255,255,.12); color: #fff; }
.me-mini .name { color: #fff; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-mini .ttl { color: var(--side-text); font-size: 12px; line-height: 1.3; }

/* Topbar */
.topbar { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); border-bottom: 1px solid var(--border); padding: 12px 32px; }
.content { padding: 28px 32px 56px; max-width: 1240px; }

/* Cards & stats */
.card { border-radius: var(--radius); border: 1px solid var(--border); border-top: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; }
.stat { border-radius: var(--radius); border-top: 1px solid var(--border); padding: 16px 18px; position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); opacity: .9; }
.stat.ok::after { background: var(--ok); } .stat.warn::after { background: var(--warn); } .stat.bad::after { background: var(--bad); }
.stat .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.stat .l { font-size: 12.5px; }
th { font-size: 11.5px; letter-spacing: .06em; background: var(--surface-2); }
th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
.pill { font-weight: 650; padding: 3px 10px; }
.tabs button.active { color: var(--brand); }
.seg { border-radius: 12px; box-shadow: var(--shadow); }
.seg button { border-radius: 9px; }
.seg button.active { background: var(--brand); color: #fff; }
.seg button.active .muted { color: rgba(255,255,255,.75); }
.modal { border-radius: 18px; box-shadow: var(--shadow-lg); }
.modal-head h2 { font-size: 17px; }
.modal-bg { backdrop-filter: blur(3px); }
.org-notice { border-color: transparent; background: linear-gradient(90deg, var(--brand-soft), var(--surface)); box-shadow: var(--shadow); }
.help-fab { background: linear-gradient(180deg, #1673e0, var(--brand)); }
.im-title { font-weight: 600; color: var(--brand); }
.max-band { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }

/* Login */
.login-side { background: radial-gradient(1200px 500px at -10% -10%, rgba(75,155,240,.35), transparent 60%), linear-gradient(160deg, #0b1f3a, #0f3c78); }
.login-side h1 { font-size: 34px; letter-spacing: -.03em; }
.login-perks { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; max-width: 460px; }
.login-perks li { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 12px 14px; }
.login-perks b { display: block; color: #fff; } .login-perks span { color: var(--side-text); font-size: 13px; }
.lp-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(75,155,240,.25); color: #fff; flex: none; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; box-shadow: var(--shadow-lg); max-width: 420px; }

/* Portal haqida */
.hero, .profile-hero { display: flex; gap: 20px; align-items: center; padding: 28px; border-radius: 20px; color: #fff; margin-bottom: 22px;
  background: radial-gradient(800px 300px at 100% 0%, rgba(75,155,240,.35), transparent 60%), linear-gradient(135deg, #0b1f3a, #0f3c78); box-shadow: var(--shadow-lg); }
.hero h1, .profile-hero h1 { color: #fff; font-size: 28px; margin: 4px 0 6px; }
.hero p { color: #d3def0; margin: 0; max-width: 760px; font-size: 15.5px; }
.hero-k { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8fc0f7; }
.hero-ic { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); flex: none; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: #fff; }
.sec-h { font-size: 18px; margin: 26px 0 12px; }
.feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.feat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.feat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.feat b { display: block; margin: 12px 0 4px; font-size: 15px; } .feat p { margin: 0; color: var(--muted); font-size: 13.5px; }
.feat-ic { width: 38px; height: 38px; border-radius: 11px; display: inline-grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--border); }
.timeline li { position: relative; padding: 0 0 18px 16px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -26px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--brand); }
.tl-w { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
.timeline b { display: block; margin-top: 2px; } .timeline p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.lvl-scale { display: flex; gap: 3px; margin: 12px 0 8px; }
.ls-seg { border-radius: 8px; padding: 8px 10px; min-width: 0; }
.ls-seg b { display: block; font-size: 13px; } .ls-seg span { font-size: 11.5px; opacity: .85; }
.ls-bad { background: var(--bad-soft); color: var(--bad); } .ls-warn { background: var(--warn-soft); color: var(--warn); }
.ls-brand { background: var(--brand-soft); color: var(--brand); } .ls-ok { background: var(--ok-soft); color: var(--ok); }
.priv { background: linear-gradient(135deg, var(--surface), var(--ok-soft)); }
.priv .feat-ic { background: var(--ok-soft); color: var(--ok); }
.org { display: grid; gap: 18px; justify-items: center; }
.org-top { position: relative; }
.org-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; position: relative; padding-top: 18px; border-top: 2px solid var(--border); }
.org-node { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; text-align: center; min-width: 210px; }

  { id: "reja-baho", title: "Bugungi reja va baholarim", group: "Har kungi ish", roles: ["xodim"], added: "2026-10-25", pages: ["bosh", "hisobotlar", "reja"],

  { id: "topshiriq", title: "Topshiriqni bajarish", group: "Har kungi ish", roles: ["xodim", "ceo"], added: "2026-10-24", pages: ["topshiriqlar"],

  { id: "masala", title: "Masala va taklif yozish", group: "Har kungi ish", roles: ["xodim", "ceo"], added: "2026-10-24", pages: ["masalalar"],

    tip: "Masalani hamma xodim va CEO ko'radi, ostiga izoh yozadi. Holat: Ochiq → Jarayonda → Hal qilindi." },

  { id: "kpi-korish", title: "KPI natijamni ko'rish", group: "Natijalar", roles: ["xodim"], added: "2026-10-24", pages: ["kpi", "statistika"],

    parts: [{ img: "oqish/x10-kpi.jpg", phone: true, steps: ["Ko'rinishni tanlang: Kunlik, Haftalik, 2 haftalik (bosqich), Yillik. Rahbaringiz har kuni ball qo'yadi; haftalik va 2 haftalik ball shundan o'zi chiqadi.", "Jadvalda har bir mezon bo'yicha ballaringiz. «avto» belgili mezon (Akademikda «Reja», Intizomiyda «Ochiqlik») kunlik bahodan avtomatik hisoblanadi.", "Pastdagi <b>Ball kartam</b> — har bir mezon bo'yicha ball, foizdagi taqsimot va rahbaringiz yozgan izoh (💬)."] }],

    const z = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return localDate(d); }

    if (d.length === 9) d = "998" + d;
    return d;
  }
  function loginToEmail(v) {
    v = String(v || "").trim();
    if (v.includes("@")) return v.toLowerCase();
    return phoneDigits(v) + "@" + LOGIN_DOMAIN;
  }
  const pwFromBirth = iso => { const [y, m, d] = String(iso || "").split("-"); return d && m && y ? d + m + y : ""; };
  window.loginUtil = { phoneDigits, loginToEmail, pwFromBirth, LOGIN_DOMAIN };

  // ---------------------------------------------------------------- DEMO

        { ...P("u-ceo2", "Javohir Rahimov", "ceo2@demo.uz", "ceo"), bolim: "akademik" },

        P("u-r1", "Shavkat Nazarov", "rahbar@demo.uz", "rahbar"),

      ];

      const T = (title, category, assigned_to, created_by, due, status, priority, description) => ({

        created_at: new Date().toISOString(), updated_at: new Date().toISOString()
      });
      const tasks = [

        T("Ona tili o'qituvchilari dars ishlanmalarini tahlil qilish", "hujjat_tahlili", "u-x2", "u-ceo1", 3, "jarayonda"),
        T("O'quvchilar o'rtasida so'rovnoma o'tkazish (8-sinflar)", "sorovnoma", "u-x3", "u-ceo2", -1, "jarayonda", "yuqori"),
        T("Yosh o'qituvchilarga baholash mezonlari bo'yicha yordam", "uslubiy_yordam", "u-x4", "u-ceo2", 5, "yangi"),
        T("5-sinflar ingliz tili darslarini kuzatish", "dars_kuzatuvi", "u-x5", "u-ceo3", 2, "bajarildi"),
        T("Oylik monitoring natijalarini jamlash", "hujjat_tahlili", "u-ceo1", "u-asoschi", 6, "yangi", "yuqori"),

          written_by: a === "u-ceo1" ? "u-asoschi" : (profiles.find(p => p.id === a) || {}).ceo_id
        });
      });
      reports.push({ id: rid++, author_id: "u-x1", report_date: today(), done: "7-A sinfda darsni kuzatish uchun tayyorgarlik ko'rildi.",
        problems: "", plan: "Ertaga darsga kirish.", hours: 4, status: "tasdiqlandi", reviewer_note: "", reviewed_by: null, grade: 8,
        staff_note: "Ertaga 9:00 da 7-A sinfga kiring, varaqani o'zingiz bilan oling.", written_by: "u-ceo1" });
      return {
        profiles, tasks, reports, nextTask: tid, nextReport: rid,
        posts: [
          { id: 1, category: "ichki_muammo", body: "Samarqanddagi 426-xonada doska ishlamayapti.", link: "", author_id: "u-x1", status: "ochiq", created_at: new Date(Date.now() - 3600e3).toISOString() },
          { id: 2, category: "taklif", body: "#taklif Kunlik hisobotlarni markazlashtirib, bitta joyda yuritish kerak.", link: "", author_id: "u-ceo2", status: "jarayonda", created_at: new Date(Date.now() - 86400e3 * 2).toISOString() },
          { id: 3, category: "video_kontent", body: "USTOZLAR FAOLIYATINI BAHOLASH TIZIMI bo'yicha batafsil video.", link: "https://youtube.com", author_id: "u-asoschi", status: "ochiq", created_at: new Date(Date.now() - 86400e3 * 4).toISOString() }
        ],
        comments: [{ id: 1, post_id: 1, author_id: "u-ceo1", body: "Xo'jalik bo'limiga aytildi.", created_at: new Date().toISOString() }],
        nextPost: 4, nextComment: 2, videos: [], nextVideo: 1,
        plans: (() => { const now = new Date(); const dow = (now.getDay() + 6) % 7; const ws = addDays(-dow);
          const days = { "1": "2 ta dars kuzatuvi (7-A, 8-B)", "2": "Kuzatuv varaqalarini tahlil qilish", "3": "Filialga tashrif, 3 ta dars", "4": "O'qituvchilar bilan suhbat", "5": "Haftalik xulosa tayyorlash", "6": "Hujjatlarni tartiblash" };
          return ["u-x1", "u-x2", "u-ceo1"].map(u => ({ user_id: u, week_start: ws, plan: "", days: { ...days }, updated_by: u === "u-ceo1" ? "u-asoschi" : "u-ceo1" })); })(),
        about: {
          full_name: "Yosinxon Ahmadxonov",
          title: "Monitoring bo'limi rahbari, Registon maktabi",
          bio: "Ta'lim sifatini monitoring qilish, o'qituvchilarga uslubiy yordam ko'rsatish va maktab rahbarlari bilan hamkorlikda ishlash bo'yicha mutaxassis.",
          phone: "", telegram: "", website: "https://yosinxon-reg.github.io/mening-saytim/", photo_url: ""
        }
      };
    }

    const me = () => load().profiles.find(p => p.id === meId) || null;
    const pub = p => { if (!p) return p; const { password, ...rest } = p; return { ...rest }; };
    const isMember = (uid) => { const m = me(); const p = load().profiles.find(x => x.id === uid);
      return m && m.role === "ceo" && p && p.ceo_id === m.id; };
    const ok = v => Promise.resolve(JSON.parse(JSON.stringify(v)));
    const fail = msg => Promise.reject(new Error(msg));

    return {
      mode: "demo",
      async restore() { return pub(me()); },
      async needsSetup() { return false; },
      async signIn(email, password) {
        const p = load().profiles.find(x => x.email.toLowerCase() === loginToEmail(email));
        if (!p || p.password !== password) return fail("Login yoki parol noto'g'ri");
        if (!p.active) return fail("Hisobingiz o'chirilgan. Asoschiga murojaat qiling.");
        meId = p.id; try { localStorage.setItem(KEY + "_me", meId); } catch (e) {}
        return pub(p);
      },
      async signInTeacher({ full_name, filial }) {
        const d = load();
        const p = { id: "u-t" + Date.now(), email: "", password: null, full_name, filial, role: "oqituvchi", ceo_id: null, phone: "", active: true };
        d.profiles.push(p); save();
        meId = p.id; try { localStorage.setItem(KEY + "_me", meId); } catch (e) {}
        return pub(p);
      },
      async signOut() { meId = null; try { localStorage.removeItem(KEY + "_me"); } catch (e) {} },
      async changePassword(pw) { const m = me(); m.password = pw; save(); return true; },
      async getAbout() { return ok(load().about); },
      async saveAbout(a) { if (me()?.role !== "asoschi") return fail("Ruxsat yo'q"); Object.assign(load().about, a); save(); return true; },

      async listProfiles() {
        const m = me(); if (!m) return [];
        const all = load().profiles;
        let v;
        if (m.role === "asoschi") v = all;
        else if (["ceo", "xodim"].includes(m.role)) v = all.filter(p => p.id === m.id || ["asoschi", "ceo", "xodim"].includes(p.role));
        else v = all.filter(p => p.id === m.id);
        return ok(v.map(pub));
      },
      async updateProfile(id, patch) {
        const m = me(); const p = load().profiles.find(x => x.id === id);
        if (!p) return fail("Topilmadi");
        if (m.role !== "asoschi") {
          if (id !== m.id) return fail("Ruxsat yo'q");
          patch = { full_name: patch.full_name, phone: patch.phone, filial: patch.filial };
        }
        Object.keys(patch).forEach(k => patch[k] !== undefined && (p[k] = patch[k]));
        save(); return pub(p);
      },
      async createUser({ login, password, full_name, role, ceo_id, ...extra }) {
        if (me()?.role !== "asoschi") return fail("Ruxsat yo'q");
        const d = load(); const email = loginToEmail(login);
        if (d.profiles.some(p => p.email.toLowerCase() === email)) return fail("Bu login band");
        const p = { id: "u-" + Date.now() + Math.random().toString(36).slice(2, 5), email, password, full_name, role, ceo_id: ceo_id || null, phone: "", active: true, ...extra };
        d.profiles.push(p); save(); return pub(p);
      },

      async listTasks() {
        const m = me(); if (!m) return [];
        return ok(load().tasks.filter(t => m.role === "asoschi" || t.assigned_to === m.id || t.created_by === m.id || isMember(t.assigned_to)));
      },
      async createTask(t) {
        const m = me(); const d = load();
        if (!(m.role === "asoschi" || (m.role === "ceo" && (isMember(t.assigned_to) || t.assigned_to === m.id)))) return fail("Bu odamga topshiriq bera olmaysiz");
        const row = { result_note: "", review_note: "", status: "yangi", ...t, id: d.nextTask++, created_by: m.id,
          created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
        d.tasks.push(row); save(); return ok(row);
      },
      async updateTask(id, patch) {
        const m = me(); const t = load().tasks.find(x => x.id === id);
        if (!t) return fail("Topilmadi");
        const manager = m.role === "asoschi" || t.created_by === m.id || isMember(t.assigned_to);
        if (!manager) {
          if (t.assigned_to !== m.id) return fail("Ruxsat yo'q");
          const p2 = {};
          if (patch.status && ["jarayonda", "bajarildi"].includes(patch.status)) p2.status = patch.status;
          if (patch.result_note !== undefined) p2.result_note = patch.result_note;
          if (patch.result_images !== undefined) p2.result_images = patch.result_images;
          patch = p2;
        }
        Object.assign(t, patch, { updated_at: new Date().toISOString() }); save(); return ok(t);
      },
      async deleteTask(id) {
        const m = me(); const d = load(); const t = d.tasks.find(x => x.id === id);
        if (!t || !(m.role === "asoschi" || t.created_by === m.id)) return fail("Ruxsat yo'q");
        d.tasks = d.tasks.filter(x => x.id !== id); save(); return true;
      },

      async listReports({ from, to } = {}) {
        const m = me(); if (!m) return [];
        return ok(load().reports.filter(r =>
          (r.author_id === m.id || m.role === "asoschi" || isMember(r.author_id)) &&
          (!from || r.report_date >= from) && (!to || r.report_date <= to)));
      },
      async saveMyReport(r) {
        const m = me(); const d = load();
        if (!["xodim", "ceo", "asoschi"].includes(m.role)) return fail("Ruxsat yo'q");
        let ex = d.reports.find(x => x.author_id === m.id && x.report_date === r.report_date);
        if (ex) {
          if (ex.grade !== null && ex.grade !== undefined && ex.grade !== "") return fail("Baholangan hisobotni o'zgartirib bo'lmaydi");

        } else {
          ex = { id: d.nextReport++, author_id: m.id, report_date: r.report_date, done: r.done, problems: r.problems, data: r.data || {}, grade: null, staff_note: "",
            plan: r.plan, hours: r.hours, status: "yuborildi", reviewer_note: "", reviewed_by: null, written_by: m.id, created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
          d.reports.push(ex);
        }
        save(); return ok(ex);
      },
      async gradeReport(author_id, report_date, f) {
        const m = me(); const d = load();
        if (!(m.role === "asoschi" ? author_id !== m.id : isMember(author_id))) return fail("Ruxsat yo'q");
        let ex = d.reports.find(x => x.author_id === author_id && x.report_date === report_date);
        if (!ex) { ex = { id: d.nextReport++, author_id, report_date, done: "", problems: "", plan: "", hours: 0, data: {}, written_by: m.id, created_at: new Date().toISOString() }; d.reports.push(ex); }
        Object.assign(ex, { grade: f.grade, staff_note: f.staff_note || "", status: "tasdiqlandi", reviewed_by: m.id, reviewed_at: new Date().toISOString() });
        save(); return ok(ex);
      },
      async saveStaffReport(author_id, report_date, f) {
        const m = me(); const d = load();
        if (!(m.role === "asoschi" ? author_id !== m.id : isMember(author_id))) return fail("Ruxsat yo'q");
        let ex = d.reports.find(x => x.author_id === author_id && x.report_date === report_date);
        if (!ex) { ex = { id: d.nextReport++, author_id, report_date, hours: 0, reviewer_note: "", reviewed_by: null }; d.reports.push(ex); }
        Object.assign(ex, { done: f.done || "", problems: f.problems || "", plan: f.plan || "", grade: f.grade ?? null, staff_note: f.staff_note || "",
          status: "tasdiqlandi", written_by: m.id, updated_at: new Date().toISOString() });
        save(); return ok(ex);

      async reviewReport(id, status, note) {
        const m = me(); const r = load().reports.find(x => x.id === id);
        if (!r || !(m.role === "asoschi" || isMember(r.author_id))) return fail("Ruxsat yo'q");
        Object.assign(r, { status, reviewer_note: note || "", reviewed_by: m.id }); save(); return ok(r);

            ${prev.avg !== null ? `<div class="small muted">Oldingi bosqich: <b>${prev.avg}</b>/10</div>` : ""}</div></div>
            <p class="small muted" style="margin-bottom:0">Kunlik hisobotni rahbaringiz yozadi va 1–10 ball bilan baholaydi. Darajangiz 2 haftalik o'rtacha baho asosida chiqadi.</p></div>
          <div class="card"><div class="card-head"><h2>Topshiriqlarim</h2><span class="spacer"></span><a href="#/masalalar" class="btn sm" data-gote="t">Barchasi</a></div>

  // ---- task line (used on dashboards)
  function taskLine(t) {
    return `<div class="list-item click" data-task="${t.id}"><div style="flex:1;min-width:0">
      <div class="t">${esc(t.title)}</div>
      <div class="small muted">${esc(CATS[t.category] || t.category)}${t.assigned_to !== S.me.id ? " · " + esc(nameOf(t.assigned_to)) : ""} · muddat: ${fmtDue(t.due_date, t.due_time)}</div></div>

  const bindTaskLines = root => $$("[data-task]", root).forEach(el => el.onclick = () => openTask(+el.dataset.task || el.dataset.task));

  // ---- Topshiriqlar
  function tasksView(page) {
    const f = S.ui.tf || (S.ui.tf = { status: "faol", who: "", cat: "" });
    const mgr = isManager();
    let list = S.tasks.slice();
    if (S.me.role === "xodim") list = list.filter(t => t.assigned_to === S.me.id);
    if (f.status === "faol") list = list.filter(t => ACTIVE_T.includes(t.status) || t.status === "bajarildi");
    else if (f.status === "kechikkan") list = list.filter(isOverdue);
    else if (f.status) list = list.filter(t => t.status === f.status);
    if (f.who) list = list.filter(t => t.assigned_to === f.who);
    if (f.cat) list = list.filter(t => t.category === f.cat);
    list.sort((a, b) => (isOverdue(b) - isOverdue(a)) || ((a.due_date || "9") < (b.due_date || "9") ? -1 : 1));
    const people = mgr ? assignable() : [];
    page.innerHTML = `
      <div class="filters">
        <select id="f-status"><option value="faol">Faol</option><option value="kechikkan">Muddati o'tgan</option>
          ${Object.entries(TSTAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}<option value="">Barchasi</option></select>
        ${mgr ? `<select id="f-who"><option value="">Barcha ijrochilar</option>${people.map(p => `<option value="${p.id}">${esc(p.full_name)}</option>`).join("")}</select>` : ""}
        <select id="f-cat"><option value="">Barcha turlar</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      </div>
      <div class="card"><div class="table-wrap">
        ${list.length ? `<table><thead><tr><th>Topshiriq</th>${mgr ? "<th>Ijrochi</th><th>Ko'rdimi</th>" : ""}<th>Muddat</th><th>Holat</th><th class="hide-sm">Muhimlik</th></tr></thead><tbody>
          ${list.map(t => `<tr class="click ${isNewForMe("task", t) ? "unseen" : ""}" data-task="${t.id}"><td><b>${esc(t.title)}</b> ${isNewForMe("task", t) ? pill("yangi", "Yangi") : ""}<div class="small muted">${esc(CATS[t.category] || t.category)} · beruvchi: ${esc(nameOf(t.created_by))} · ${fmtDate(t.created_at)} ${tmOf(t.created_at)}</div></td>
            ${mgr ? `<td>${esc(nameOf(t.assigned_to))}</td><td>${t.assigned_to === S.me.id ? `<span class="muted small">o'zim</span>` : seenTag("task", t.id, t.assigned_to)}</td>` : ""}<td>${t.due_date ? fmtDate(t.due_date) + (t.due_time ? " " + t.due_time : "") : "—"} ${isOverdue(t) ? pill("overdue", "kechikdi") : ""}</td>
            <td>${pill(t.status, TSTAT[t.status])}</td><td class="hide-sm">${t.priority === "yuqori" ? pill("yuqori", "Yuqori") : esc(PRIO[t.priority])}</td></tr>`).join("")}
          </tbody></table>` : `<div class="empty">Bu filtr bo'yicha topshiriq yo'q</div>`}
      </div></div>`;
    $("#f-status").value = f.status;
    if ($("#f-who")) $("#f-who").value = f.who;
    $("#f-cat").value = f.cat;
    ["status", "who", "cat"].forEach(k => { const el = $("#f-" + k); if (el) el.onchange = () => { f[k] = el.value; tasksView(page); }; });
    $$("tr[data-task]", page).forEach(el => el.onclick = () => openTask(+el.dataset.task || el.dataset.task));
  }

  function taskForm(t) {
    const people = assignable();
    const m = openModal(t ? "Topshiriqni tahrirlash" : "Yangi topshiriq", `
      <form id="tform">
        <div class="field"><label>Nomi *</label><input name="title" required maxlength="200" value="${esc(t?.title)}"></div>
        <div class="field"><label>Tavsif</label><textarea name="description" placeholder="Nima qilish kerak, qanday natija kutilmoqda">${esc(t?.description)}</textarea></div>
        ${t ? `<div class="field"><label>Ijrochi</label><select name="assigned_to">${people.map(p => `<option value="${p.id}" ${t.assigned_to === p.id ? "selected" : ""}>${esc(p.full_name)}</option>`).join("")}</select></div>`
          : `<div class="field"><label>Kimga yuboriladi * <span class="muted">(bo'lim yoki alohida xodimlar)</span></label><div id="t-rp" class="rp"></div></div>`}
        <div class="field"><label>Qachongacha</label><div id="t-dl"></div></div>
        ${t ? "" : `<div class="field"><label>Rasm <span class="muted">(ixtiyoriy)</span></label><div id="t-img"></div></div>`}
        <div class="grid2">
          <div class="field"><label>Turi</label><select name="category">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${t?.category === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
          <div class="field"><label>Muhimlik</label><select name="priority">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${(t?.priority || "oddiy") === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="err-text" id="t-err"></div>
      </form>`, `<button class="btn" data-close>Bekor qilish</button><button class="btn primary" id="tsave">${t ? "Saqlash" : "Yuborish"}</button>`);
    $(".modal", $("#modal-root")).style.maxWidth = "680px";
    const getDl = deadlinePicker($("#t-dl", m), t ? (t.due_date || null) : window.dateUtil.addDays(1), t?.due_time || "");
    const getRp = t ? null : recipientPicker($("#t-rp", m), people);
    const getTImg = t ? null : imgPicker($("#t-img", m));
    $("#tsave", m).onclick = async e => {
      const form = $("#tform", m); if (!form.reportValidity()) return;
      const d = Object.fromEntries(new FormData(form)); Object.assign(d, getDl());
      if (t) { await act(() => db.updateTask(t.id, d), "Saqlandi"); await refresh(); render(); return; }
      const ids = getRp(); if (!ids.length) return ($("#t-err", m).textContent = "Kamida bitta xodimni tanlang");
      e.target.disabled = true; e.target.textContent = "Yuborilmoqda…";
      try { d.images = await getTImg(); } catch (err) { e.target.disabled = false; e.target.textContent = "Yuborish"; return ($("#t-err", m).textContent = err.message); }
      let ok = 0;
      for (const id of ids) { try { await db.createTask({ ...d, assigned_to: id }); ok++; } catch (err) { $("#t-err", m).textContent = err.message; } }
      toast(`${ok} kishiga topshiriq yuborildi`); await refresh(); render();
    };
  }

  function openTask(id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    const mine = t.assigned_to === S.me.id;
    markSeen("task", t.id);
    const manage = canManageTask(t);
    let foot = "";
    if (mine && ["yangi", "qaytarildi"].includes(t.status)) foot += `<button class="btn" data-st="jarayonda">Boshlash</button>`;
    if (mine && ACTIVE_T.includes(t.status)) foot += `<button class="btn primary" id="t-done">Bajarildi deb belgilash</button>`;
    if (manage && t.status === "bajarildi" && !(mine && S.me.role !== "asoschi" && t.created_by !== S.me.id)) {
      foot += `<button class="btn bad" id="t-return">Qaytarish</button><button class="btn ok" data-st="yopildi">Qabul qilish</button>`;
    }
    if (manage) foot = `<button class="btn sm" id="t-edit">Tahrirlash</button>${(S.me.role === "asoschi" || t.created_by === S.me.id) ? `<button class="btn sm bad" id="t-del">O'chirish</button>` : ""}<span class="spacer"></span>` + foot;
    const m = openModal(esc(t.title), `
      <div class="row" style="margin-bottom:12px">${pill(t.status, TSTAT[t.status])} ${isOverdue(t) ? pill("overdue", "Muddati o'tgan") : ""} ${pill("", CATS[t.category] || t.category)} ${t.priority === "yuqori" ? pill("yuqori", "Muhim") : ""}</div>
      ${t.description ? `<p style="white-space:pre-wrap;margin-top:0">${esc(t.description)}</p>` : ""}
      ${imgGallery(t.images)}
      ${t.post_id && S.posts.some(x => x.id === t.post_id) ? `<p style="margin:6px 0 10px"><a href="#" id="t-post" class="btn sm">💬 Masalani ochish</a></p>` : ""}
      <table class="small"><tbody>
        <tr><td class="muted">Ijrochi</td><td><b>${esc(nameOf(t.assigned_to))}</b></td></tr>
        <tr><td class="muted">Beruvchi</td><td>${esc(nameOf(t.created_by))}</td></tr>
        <tr><td class="muted">Ijrochi ko'rdimi</td><td>${t.assigned_to === t.created_by ? `<span class="muted">—</span>` : seenTag("task", t.id, t.assigned_to, true)}</td></tr>
        <tr><td class="muted">Muddat</td><td>${fmtDue(t.due_date, t.due_time)}</td></tr>
        <tr><td class="muted">Berilgan vaqt</td><td>${fmtDate(t.created_at)} ${tmOf(t.created_at)}</td></tr></tbody></table>
      ${t.result_note || (t.result_images || []).length ? `<div class="note"><b>Ijrochi natijasi:</b>\n${esc(t.result_note || "")}${imgGallery(t.result_images, true)}</div>` : ""}
      ${t.review_note ? `<div class="note bad"><b>Rahbar izohi:</b>\n${esc(t.review_note)}</div>` : ""}
      <div id="t-extra"></div>`, foot);
    const reload = async () => { await refresh(); render(); };
    hydrateImgs(m);
    if ($("#t-post", m)) $("#t-post", m).onclick = e => { e.preventDefault(); openPost(t.post_id); };
    $$("[data-st]", m).forEach(b => b.onclick = async () => { await act(() => db.updateTask(t.id, { status: b.dataset.st }), "Holat yangilandi"); reload(); });
    const done = $("#t-done", m);
    if (done) done.onclick = () => {
      $("#t-extra", m).innerHTML = `<div class="field" style="margin-top:14px"><label>Natija haqida qisqacha *</label><textarea id="res" placeholder="Nima qilindi, qanday natija">${esc(t.result_note)}</textarea></div>
        <div class="field"><label>Natija rasmi <span class="muted">(ixtiyoriy)</span></label><div id="res-img"></div></div>`;
      const getRImg = imgPicker($("#res-img", m));
      done.textContent = "Yuborish";
      done.onclick = async () => {
        const v = $("#res", m).value.trim(); if (!v) return toast("Natijani yozing", true);
        done.disabled = true; let ri = [];
        try { ri = await getRImg(); } catch (err) { done.disabled = false; return toast(err.message, true); }
        const patch = { status: "bajarildi", result_note: v }; if (ri.length) patch.result_images = [...(t.result_images || []), ...ri];
        await act(() => db.updateTask(t.id, patch), "Tekshiruvga yuborildi").catch(() => { done.disabled = false; }); reload();
      };
    };
    const ret = $("#t-return", m);
    if (ret) ret.onclick = () => {
      $("#t-extra", m).innerHTML = `<div class="field" style="margin-top:14px"><label>Nima uchun qaytarilmoqda? *</label><textarea id="rn"></textarea></div>`;
      ret.textContent = "Qaytarishni tasdiqlash";
      ret.onclick = async () => {
        const v = $("#rn", m).value.trim(); if (!v) return toast("Izoh yozing", true);
        await act(() => db.updateTask(t.id, { status: "qaytarildi", review_note: v }), "Qaytarildi"); reload();
      };
    };
    if ($("#t-edit", m)) $("#t-edit", m).onclick = () => taskForm(t);
    if ($("#t-del", m)) $("#t-del", m).onclick = async e => {
      if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Rostdan o'chirilsinmi?"; return; }
      await act(() => db.deleteTask(t.id), "O'chirildi"); reload();
    };
  }

  // ---- Hisobotlar: kunlik hisobotni rahbar yozadi va baholaydi
  PAGES.hisobotlar = page => {
    const r = S.me.role;
    if (r === "xodim" && isSelfReporter(S.me)) {
      const tb = S.ui.mytab || "yozish";
      page.innerHTML = head("Kunlik hisobotim", `Har kuni ish oxirida hisobotni o'zingiz yozasiz — rahbaringiz izoh qoldirib baholaydi, baho KPI'ga avtomatik o'tadi. Eslatma ${askTime(S.me)} da chiqadi.`) +
        `<div class="tabs"><button data-mt="yozish" class="${tb === "yozish" ? "active" : ""}">Hisobot yozish</button><button data-mt="baho" class="${tb === "baho" ? "active" : ""}">Hisobotlarim va baholarim</button></div><div id="rbody"></div>`;
      $$("[data-mt]", page).forEach(b => b.onclick = () => { S.ui.mytab = b.dataset.mt; PAGES.hisobotlar(page); });
      return tb === "yozish" ? myReportForm($("#rbody", page)) : myGrades($("#rbody", page), S.me);
    }
    if (r === "xodim") { page.innerHTML = head("Kunlik baholarim", "Kunlik hisobotingizni rahbaringiz yozadi va baholaydi. Bu yerda darajangiz va rahbar eslatmalarini ko'rasiz.") + `<div id="rbody"></div>`; return myGrades($("#rbody", page), S.me); }
    const tabs = r === "ceo" ? ["team", "mine"] : ["team"];
    const tab = S.ui.rtab && tabs.includes(S.ui.rtab) ? S.ui.rtab : tabs[0];
    const labels = { team: r === "asoschi" ? "Xodimlar hisobotlari" : "Jamoam hisobotlari", mine: "Mening baholarim" };
    page.innerHTML = head("Hisobotlar va baholar", r === "ceo" ? "Xodimlar kunlik hisobotni o'zlari yozadi. Siz hisobotni ko'rib, izoh qoldirasiz va 1–10 ball bilan baholaysiz — baho KPI'ga avtomatik o'tadi." : "Bo'lim rahbarlari va shaxsiy bo'lim uchun kunlik hisobot va baho. Bo'lim xodimlari hisobotni o'zlari yozadi, rahbarlari baholaydi.") +
      (tabs.length > 1 ? `<div class="tabs">${tabs.map(k => `<button data-tab="${k}" class="${k === tab ? "active" : ""}">${labels[k]}</button>`).join("")}</div>` : "") + `<div id="rbody"></div>`;
    $$("[data-tab]", page).forEach(b => b.onclick = () => { S.ui.rtab = b.dataset.tab; PAGES.hisobotlar(page); });
    tab === "mine" ? myGrades($("#rbody", page), S.me) : teamReports($("#rbody", page));
  };

  function teamReports(root) {
    const t = today(); const date = S.ui.tdate || t;
    const isA = S.me.role === "asoschi";
    const ceoF = S.ui.tceo ?? (isA ? "mine" : "");
    let mem = isA ? S.profiles.filter(p => p.active && ["ceo", "xodim"].includes(p.role)) : members();
    if (ceoF === "mine") mem = writeFor();
    else if (ceoF) mem = mem.filter(p => p.ceo_id === ceoF);
    const ps = periodOf(date);
    const rows = mem.map(p => ({ p, r: S.reports.find(x => x.author_id === p.id && x.report_date === date), g: avgGrade(p, ps, addD(ps, 13)) }))
      .sort((a, b) => (!!a.r - !!b.r) || (a.p.role === "ceo" ? -1 : 0) - (b.p.role === "ceo" ? -1 : 0) || a.p.full_name.localeCompare(b.p.full_name));
    const work = rows.filter(x => sched(x.p).days.includes(dowOf(date)));
    const done = work.filter(x => x.r).length;
    root.innerHTML = `
      <div class="filters">
        <input type="date" id="td" value="${date}" max="${t}" style="width:auto">
        ${isA ? `<select id="tc" style="width:auto"><option value="mine" ${ceoF === "mine" ? "selected" : ""}>Men baholaydiganlar (bo'lim rahbarlari va shaxsiy bo'lim)</option>${S.profiles.filter(p => p.role === "ceo" && p.active).map(c => `<option value="${c.id}" ${ceoF === c.id ? "selected" : ""}>${esc(c.full_name)} jamoasi</option>`).join("")}</select>` : ""}
        ${isA && rows.some(x => byFounder(x.p) && sched(x.p).days.includes(dowOf(date)) && !(x.r && +x.r.grade === 10)) ? `<button class="btn sm max-btn" id="qmax-all">★ Hammasiga maksimal ball</button>` : ""}
        <span class="spacer"></span><div class="row"><b>${done}/${work.length}</b><span class="muted">ta xodimga yozildi · ${fmtDate(date)}, ${esc(KUN[dowOf(date)].toLowerCase())}</span></div>
      </div>
      <div class="rep-grid">${rows.map(({ p, r, g }) => {
        const off = !sched(p).days.includes(dowOf(date));
        const plan = dayPlan(p, date);
        return `<div class="card rep-card ${r ? "done" : off ? "off" : "todo"}">
          <div class="row" style="gap:10px;flex-wrap:nowrap">${avatar(p.full_name, photoOf(p))}<div style="flex:1;min-width:0"><b>${esc(p.full_name)}</b>
            <div class="small muted">${esc(titleOf(p))}</div>${canSeeSeen(p) ? `<div class="small">${seenPill(p)}</div>` : ""}</div>
            <div style="text-align:right">${isGraded(r) ? gradePill(r.grade) : isSelfReporter(p) && isWritten(r) ? pill("yangi", "Baholanmagan") : r ? gradePill(r.grade) : off ? `<span class="small muted">Dam olish</span>` : pill("missing", isSelfReporter(p) ? "Yubormagan" : "Yozilmagan")}<div class="small muted" style="margin-top:4px">Bosqich: ${g.avg ?? "—"} ${levelOf(g.avg) ? "· " + levelOf(g.avg)[1] : ""}</div></div></div>
          <div class="rc-plan"><span class="small muted">Reja:</span> ${plan ? esc(plan) : `<span class="muted">kiritilmagan</span>`}</div>
          ${r ? `<div class="rc-done">${esc((r.done || "").slice(0, 180))}${(r.done || "").length > 180 ? "…" : ""}</div>${r.staff_note ? `<div class="rc-note">📌 ${esc(r.staff_note)}</div>` : ""}` : ""}
          <div class="row" style="margin-top:10px">${canRate(p) ? (isSelfReporter(p)
              ? `<button class="btn sm ${isWritten(r) && !isGraded(r) ? "primary" : ""}" data-wrep="${p.id}">${isGraded(r) ? "Ko'rish va tahrirlash" : isWritten(r) ? "Ko'rish va baholash" : "Baholash"}</button>`
              : `<button class="btn sm ${r ? "" : "primary"}" data-wrep="${p.id}">${r ? "Tahrirlash" : "Hisobot yozish va baholash"}</button>`) : ""}
            ${isA && byFounder(p) && !off && !(r && +r.grade === 10) ? `<button class="btn sm max-btn" data-qmax="${p.id}" title="Baho 10, umumiy ball 100">★ Maksimal ball</button>` : ""}
            <button class="btn sm ghost" data-info="${p.id}">Profil va reja</button></div></div>`; }).join("") || `<div class="empty">Xodimlar yo'q</div>`}</div>`;
    $("#td", root).onchange = e => { S.ui.tdate = e.target.value; teamReports(root); };
    if ($("#tc", root)) $("#tc", root).onchange = e => { S.ui.tceo = e.target.value; teamReports(root); };
    $$("[data-wrep]", root).forEach(b => b.onclick = () => openStaffReport(person(b.dataset.wrep), date));

        const ch = await saveDay(p, nd, $("#rv-plan", m).value.trim());

  function myGrades(root, p) {

          ${x.staff_note ? `<div class="rc-note">📌 ${esc(x.staff_note)}</div>` : ""}</div></div>`).join("") : `<div class="empty">Hali hisobot yozilmagan</div>`}

  // ---- Rasmlar: siqish, yuklash, ko'rsatish
  function compressImage(file, max = 1600) {
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("Rasmni o'qib bo'lmadi")), "image/jpeg", 0.82); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Bu fayl rasm emas")); }; img.src = url;
    });
  }
  // Rasm tanlash bloki: () => Promise<yuklangan yo'llar>
  function imgPicker(root, label = "Rasm qo'shish") {
    const files = [];
    const draw = () => {
      root.innerHTML = `<div class="img-pick">${files.map((f, i) => `<div class="ip-th"><img src="${f.url}" alt=""><button type="button" class="ip-x" data-ipx="${i}" title="Olib tashlash">×</button></div>`).join("")}
        ${files.length < 6 ? `<label class="ip-add">📷 ${esc(label)}<input type="file" accept="image/*" multiple hidden></label>` : ""}</div>`;
      $$("[data-ipx]", root).forEach(b => b.onclick = () => { URL.revokeObjectURL(files[+b.dataset.ipx].url); files.splice(+b.dataset.ipx, 1); draw(); });
      const inp = $("input[type=file]", root); if (inp) inp.onchange = () => { [...inp.files].slice(0, 6 - files.length).forEach(f => files.push({ f, url: URL.createObjectURL(f) })); draw(); };
    };
    draw();
    return async () => { const out = []; for (const x of files) { const b = await compressImage(x.f); out.push(await db.uploadImage(b)); } return out; };
  }
  const IMGC = {};
  const imgGallery = (paths, small) => (paths && paths.length) ? `<div class="img-grid ${small ? "sm" : ""}">${paths.map(p => `<a class="img-th" data-ipath="${esc(p)}" target="_blank" rel="noopener"><img alt="" data-ipath="${esc(p)}"></a>`).join("")}</div>` : "";
  async function hydrateImgs(root) {
    const els = $$("[data-ipath]", root); if (!els.length) return;
    const need = [...new Set(els.map(e => e.dataset.ipath).filter(p => !(IMGC[p] && IMGC[p].exp > Date.now())))];
    if (need.length) { try { const m = await db.signedUrls(need); need.forEach(p => { if (m[p]) IMGC[p] = { url: m[p], exp: Date.now() + 50 * 60e3 }; }); } catch (e) {} }
    els.forEach(e => { const u = IMGC[e.dataset.ipath]?.url; if (!u) return; if (e.tagName === "IMG") e.src = u; else e.href = u; });
  }

  // ---- Masalalar

  const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  }
  const bindPostLines = root => $$("[data-post]", root).forEach(el => el.onclick = () => openPost(+el.dataset.post || el.dataset.post));
  function recentPosts() {
    if (!isStaff()) return "";
    const list = S.posts.slice(0, 5);
    return `<div class="card" style="margin-top:16px"><div class="card-head"><h2>So'nggi masalalar</h2><span class="spacer"></span><a class="btn sm" href="#/masalalar">Barchasi</a></div>

  // ---- Masalalar: topshiriqlar, eslatmalar va masalalar bitta joyda
  const POST_CATS = Object.entries(PCATS).filter(([k]) => k !== "topshiriq_eslatma");
  PAGES.masalalar = page => {

    page.innerHTML = head("Masalalar", mgr ? "Topshiriqlar, eslatmalar va masalalar — bitta joyda. Har bir xodim ko'rgani va bajargani ko'rinib turadi." : "Sizga kelgan topshiriq va eslatmalar hamda bo'lim masalalari — bitta joyda.", `<div class="row" style="gap:8px">${right}</div>`) + `
      <div class="posts-layout">
        <div class="card cat-list">
          <button class="cat-row te-row ${cat === "te" ? "active" : ""}" data-cat="te"><div class="cat-dot" style="background:#8e4ec6">✓</div><span>${S.me.role === "xodim" ? "Topshiriq va eslatmalarim" : "Topshiriqlar va eslatmalar"}</span><span class="spacer"></span>${teBadge ? `<span class="badge">${teBadge}</span>` : teActive ? `<span class="small muted">${teActive}</span>` : ""}</button>
          <div class="cat-sep"></div>

          ${POST_CATS.map(([k, [label]]) => `<button class="cat-row ${cat === k ? "active" : ""}" data-cat="${k}">${catBadge(k, 30)}<span>${esc(label)}</span><span class="spacer"></span>${newIn(k) ? `<span class="new-dot">${newIn(k)}</span>` : counts(k) ? `<span class="small muted">${counts(k)}</span>` : ""}</button>`).join("")}

    if ($("#new-task", page)) $("#new-task", page).onclick = () => taskForm();
    if ($("#new-dt", page)) $("#new-dt", page).onclick = () => dtForm();
    const body = $("#mz-body", page);
    if (cat === "te") return teView(body);
    const st = S.ui.pst ?? "";
    const list = S.posts.filter(p => (!cat || p.category === cat) && (!st || p.status === st));
    body.innerHTML = `<div class="filters">
        <select id="p-st"><option value="">Barcha holatlar</option>${Object.entries(PSTAT).map(([k, v]) => `<option value="${k}" ${st === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      </div>
      <div class="card">${list.length ? list.map(postLine).join("") : `<div class="empty">Bu bo'limda hali masala yo'q</div>`}</div>`;
    $("#p-st", body).onchange = e => { S.ui.pst = e.target.value; PAGES.masalalar(page); };
    bindPostLines(body);
  };
  function teView(root) {
    const legacy = S.posts.filter(p => p.category === "topshiriq_eslatma");
    const tabs = [["t", "Topshiriqlar", unseenMine().filter(x => x.kind === "task").length],
      ["e", "Eslatmalar", unseenMine().filter(x => x.kind === "dtask").length]];
    if (legacy.length) tabs.push(["x", "Guruhdagi xabarlar", legacy.filter(p => isNewForMe("post", p)).length]);
    const tab = tabs.some(t => t[0] === S.ui.teTab) ? S.ui.teTab : (unseenMine().some(x => x.kind === "dtask") && !unseenMine().some(x => x.kind === "task") ? "e" : "t");
    root.innerHTML = `<div class="tabs" style="margin-top:0">${tabs.map(([k, l, n]) => `<button data-tt="${k}" class="${k === tab ? "active" : ""}">${l}${n ? ` <span class="badge">${n}</span>` : ""}</button>`).join("")}</div><div id="te-body"></div>`;
    $$("[data-tt]", root).forEach(b => b.onclick = () => { S.ui.teTab = b.dataset.tt; teView(root); });

  }

  // ---- Ko'rilganlar (kim qachon ko'rdi)
  const seenRec = (kind, id, uid) => (S.views || []).find(v => v.kind === kind && v.item_id === String(id) && v.user_id === uid);
  function markSeen(kind, id) {
    if (!S.me || !isStaff() || seenRec(kind, id, S.me.id)) return;
    S.views.push({ kind, item_id: String(id), user_id: S.me.id, seen_at: new Date().toISOString(), _local: true });
    db.markSeen && db.markSeen(kind, String(id)).catch(() => {});
    setTimeout(() => { updateNav(); dueBanner(); }, 0);
  }
  function seenTag(kind, id, uid, long) {
    const v = seenRec(kind, id, uid);
    return v ? `<span class="seen-ok" title="Ko'rgan vaqti">👁 ${long ? "Ko'rdi · " : ""}${fmtDate(v.seen_at)} ${tmOf(v.seen_at)}</span>` : `<span class="seen-no">Ko'rmagan</span>`;
  }
  // Menga kelgan, hali ochilmagan topshiriq va eslatmalar
  function isNewForMe(kind, x) {
    if (!S.me) return false;
    if (kind === "task") return x.assigned_to === S.me.id && x.created_by !== S.me.id && x.status !== "yopildi" && !seenRec("task", x.id, S.me.id);
    if (kind === "dtask") return x.created_by !== S.me.id && recipientsOf(x).some(p => p.id === S.me.id) && dtStatus(x, S.me).status !== "bajarildi"
      && localOf(x.created_at || new Date().toISOString()) >= addD(today(), -30) && !seenRec("dtask", x.id, S.me.id);
    if (kind === "post") return x.author_id !== S.me.id && localOf(x.created_at) >= addD(today(), -7) && !seenRec("post", x.id, S.me.id);
    return false;
  }
  const unseenMine = () => !S.me ? [] : [...S.tasks.filter(t => isNewForMe("task", t)).map(x => ({ kind: "task", x })), ...S.dtasks.filter(t => isNewForMe("dtask", t)).map(x => ({ kind: "dtask", x }))];

      ${vs.length ? `<div class="viewers-list">${vs.map(v => { const q = person(v.user_id) || { full_name: nameOf(v.user_id) }; return `<div class="vw">${avatar(q.full_name, photoOf(q))}<div><b>${esc(q.full_name)}</b><div class="small muted">${fmtDate(v.seen_at)} ${tmOf(v.seen_at)}</div></div></div>`; }).join("")}</div>` : `<div class="small muted" style="padding:6px 0">Hali hech kim ko'rmagan</div>`}</details>`;
  }
  // Har 90 soniyada yangi topshiriq/eslatmalarni tekshirish (sahifani buzmasdan)

  };
  const CEO_EXTRA = { k: "jamoa", l: "Jamoaning faolligi", s: "Jamoa", max: 20, ceoOnly: true, d: "Hozircha asoschi qo'yadi, keyinchalik avtomatlashadi" };
  const DEPTS = {

  // Lavozim: hamma joyda (shu jumladan o'ziga) bir xil ko'rinadi
  function titleOf(p) {
    if (!p) return "";

    if (p.role === "ceo") return DEPTS[deptOf(p)].t + " rahbari";

    return ROLES[p.role] || "";
  }
  // Monitoring bo'limi rahbari (asoschi) o'zi baholaydiganlar: bo'lim rahbarlari va shaxsiy bo'lim
  const byFounder = p => !!p && (p.role === "ceo" || (p.role === "xodim" && !p.ceo_id));
  // Shaxsiy bo'lim (Monitoring bo'limi rahbariga to'g'ridan-to'g'ri bo'ysunadi) — KPI'da qatnashmaydi
  const isPersonal = p => !!p && p.role === "xodim" && !p.ceo_id;
  const SIMPLE = { k: "umumiy", l: "Umumiy natija", s: "Ball", max: 100, auto: "reja", d: "Monitoring bo'limi rahbari qo'yadi. Qo'yilmasa — kunlik hisobot bahosidan (baho × 10)" };
  function deptOf(p) {
    if (!p) return "administratsiya";
    if (p.role === "asoschi") return "administratsiya";
    if (p.role === "ceo") return DEPTS[p.bolim] ? p.bolim : "intizomiy";
    const c = p.ceo_id && person(p.ceo_id);
    return c ? deptOf(c) : (DEPTS[p.bolim] ? p.bolim : "administratsiya");
  }
  const itemsFor = p => isPersonal(p) ? [] : byFounder(p) ? [SIMPLE] : KPI_TPL[DEPTS[deptOf(p)].tpl].items;
  const KPI_ANCHOR = "2026-10-19";
  const addD = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return window.dateUtil.localDate(d); };
  const dayDiff = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
  const periodOf = iso => addD(KPI_ANCHOR, Math.floor(dayDiff(KPI_ANCHOR, iso) / 14) * 14);
  const periodLabel = ps => `${fmtDate(ps)} – ${fmtDate(addD(ps, 13))}`;
  // ---- Bo'lim eslatma-topshiriqlari: yordamchilar
  const recipientsOf = t => S.profiles.filter(p => p.active && ["xodim", "ceo"].includes(p.role) &&
    (t.recipients && t.recipients.length ? t.recipients.includes(p.id) : (t.depts || []).includes(deptOf(p))));
  const dtStatus = (t, p) => S.dstatus.find(r => r.task_id === t.id && r.user_id === p.id) || { status: "kutilmoqda", self_done: false, self_note: "" };
  const dtDate = t => t.due_date || window.dateUtil.localDate(new Date(t.created_at));

  const DTS_CLS = { kutilmoqda: "yangi", bajarildi: "tasdiqlandi", bajarilmadi: "qaytarildi" };
  const inDays = (iso, from, to) => iso >= from && iso <= to;
  const localOf = ts => window.dateUtil.localDate(new Date(ts));

  // Har qanday oraliq uchun avtomatik ko'rsatkich (0..1)
  function rangeAuto(p, kind, from, to, reps = S.reports) {
    const t = today();
    if (kind === "reja" || kind === "eslatma") {
      let list = kind === "reja" ? S.tasks.filter(x => x.assigned_to === p.id && inDays(x.due_date || localOf(x.created_at), from, to)) : [];
      if (deptOf(p) === "akademik" && list.some(x => x.category === "dars_kuzatuvi")) list = list.filter(x => x.category === "dars_kuzatuvi");
      const dts = S.dtasks.filter(x => inDays(dtDate(x), from, to) && recipientsOf(x).some(r => r.id === p.id));
      const total = list.length + dts.length;
      if (!total) return { r: null, why: kind === "reja" ? "Bu davrda topshiriq yo'q" : "Eslatma yo'q" };
      const done = list.reduce((a, x) => a + (x.status === "yopildi" ? 1 : x.status === "bajarildi" ? 0.5 : 0), 0)
        + dts.filter(x => dtStatus(x, p).status === "bajarildi").length;
      return { r: done / total, why: `${total} ta topshiriq/eslatmadan ${done} tasi bajarilgan` };
    }
    if (kind === "hisobot") {
      // Rahbar qo'ygan kunlik baholarning o'rtachasi (1–10) -> 0..1
      const g = reps.filter(x => x.author_id === p.id && x.grade !== null && x.grade !== undefined && x.grade !== "" && inDays(x.report_date, from, to));
      if (!g.length) return { r: null, why: "Bu davrda kunlik baho yo'q" };
      const avg = g.reduce((a, x) => a + +x.grade, 0) / g.length;
      return { r: avg / 10, why: `${g.length} kunlik baho, o'rtacha ${Math.round(avg * 10) / 10}/10` };
    }
    return { r: null };
  }
  function hintFor(p, item, ps) {
    const pe = addD(ps, 13);
    const mine = S.posts.filter(x => x.author_id === p.id && x.created_at && inDays(localOf(x.created_at), ps, pe));
    if (item.hint === "posts") return `${mine.length} ta masala kiritgan`;
    if (item.hint === "resolved") return `${mine.filter(x => x.status === "hal_qilindi").length} ta masala hal qilingan`;
    if (item.hint === "taklif") return `${mine.filter(x => x.category === "taklif").length} ta taklif`;
    return "";
  }
  // ---- KPI darajalari: kunlik -> haftalik -> 2 haftalik (bosqich)
  const LVL = { kun: "Kunlik", hafta: "Haftalik", bosqich: "2 haftalik" };
  const rnd = v => Math.round(v * 10) / 10;
  const avgOf = a => { const v = a.filter(x => x !== null && x !== undefined); return v.length ? rnd(v.reduce((s, x) => s + x, 0) / v.length) : null; };
  const manAt = (K, lvl, d, uid, k) => (lvl === "kun" ? K.daily : lvl === "hafta" ? K.week : K.scores).find(r => (r.day || r.week_start || r.period_start) === d && r.user_id === uid && r.criterion === k);
  const scoreOf = r => r && r.score !== null && r.score !== undefined && r.score !== "" ? +r.score : null;
  // Kunlik: CEO qo'ygani; bo'lmasa "Reja" — shu kungi hisobot bahosidan
  function dayAuto(p, it, d, reps) {
    if (it.auto !== "reja") return null;
    const r = (reps || S.reports).find(x => x.author_id === p.id && x.report_date === d);
    return r && r.grade !== null && r.grade !== undefined && r.grade !== "" ? rnd(+r.grade / 10 * it.max) : null;
  }
  const dayVal = (p, it, d, K, reps) => scoreOf(manAt(K, "kun", d, p.id, it.k)) ?? dayAuto(p, it, d, reps);
  function weekAuto(p, it, ws, K, reps) { const v = []; for (let i = 0; i < 7; i++) v.push(dayVal(p, it, addD(ws, i), K, reps)); return avgOf(v); }
  const weekVal = (p, it, ws, K, reps) => scoreOf(manAt(K, "hafta", ws, p.id, it.k)) ?? weekAuto(p, it, ws, K, reps);
  const bosqAuto = (p, it, ps, K, reps) => avgOf([weekVal(p, it, ps, K, reps), weekVal(p, it, addD(ps, 7), K, reps)]);
  function levelAuto(p, it, lvl, d, K, reps) {
    return lvl === "kun" ? dayAuto(p, it, d, reps) : lvl === "hafta" ? weekAuto(p, it, d, K, reps) : bosqAuto(p, it, d, K, reps);
  }
  function kpiRow(p, lvl, d, K, awardId, reps) {
    const items = itemsFor(p);
    const picked = lvl === "bosqich" && awardId === p.id;
    const cells = items.map(it => {
      const man = manAt(K, lvl, d, p.id, it.k);
      const av = levelAuto(p, it, lvl, d, K, reps);
      const val = picked ? it.max : scoreOf(man) ?? av;
      return { it, man, au: { v: av }, val };
    });
    const sum = cells.reduce((a, c) => a + (c.val || 0), 0);
    const maxT = items.reduce((a, it) => a + it.max, 0);
    const pct = rnd(sum / maxT * 100);
    const fin = lvl === "bosqich" ? K.finals.find(r => r.period_start === d && r.user_id === p.id) : null;
    const final = picked ? 100 : fin && fin.final_score !== null ? +fin.final_score : pct;
    return { p, cells, sum: rnd(sum), maxT, pct, final, overridden: !!fin && !picked, picked, has: cells.some(c => c.val !== null) || !!fin || picked };
  }
  // G'oliblar: reytingdagi 1-o'rin + asoschi tanlovi (bo'lsa), aks holda eng yaxshi 2 natija
  function winners(rows, awardId) {
    const rated = rows.filter(x => x.has && !x.picked).sort((a, b) => b.final - a.final);
    const pick = rows.find(x => x.picked);
    return pick ? [...rated.slice(0, 1), pick] : rated.slice(0, 2);

  const canRate = p => S.me.role === "asoschi" || (S.me.role === "ceo" && p.ceo_id === S.me.id);
  const bosqichNo = ps => dayDiff(KPI_ANCHOR, ps) / 14 + 1;
