  <style>
:root {
  --bg: #f3f7fc;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --text: #16202e;
  --muted: #5d6b7e;
  --brand: #066ecf;
  --brand-ink: #ffffff;
  --brand-soft: #e6f1fb;
  --brand-dark: #04549f;
  --side: #066ecf;
  --side-text: #e3efff;
  --side-active: rgba(255, 255, 255, .16);
  --ok: #16834a;   --ok-soft: #e4f6ec;
  --warn: #b26b00; --warn-soft: #fff3dc;
  --bad: #c4312b;  --bad-soft: #fde8e7;
  --info: #3d5af1; --info-soft: #eaeeff;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1420; --surface: #141d2b; --surface-2: #192335; --border: #263247;
    --text: #e6ecf5; --muted: #95a3b8; --brand: #3d95ea; --brand-soft: #12304f;
    --side: #053f78; --side-active: rgba(255,255,255,.12);
    --ok-soft: #12301f; --warn-soft: #33270f; --bad-soft: #3a1717; --info-soft: #1b2448;
    --ok: #4cc685; --warn: #f0b04a; --bad: #ff7a72; --info: #8ea2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1420; --surface: #141d2b; --surface-2: #192335; --border: #263247;
  --text: #e6ecf5; --muted: #95a3b8; --brand: #3d95ea; --brand-soft: #12304f;
  --side: #053f78; --side-active: rgba(255,255,255,.12);
  --ok-soft: #12301f; --warn-soft: #33270f; --bad-soft: #3a1717; --info-soft: #1b2448;
  --ok: #4cc685; --warn: #f0b04a; --bad: #ff7a72; --info: #8ea2ff;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--brand); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.boot { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- Buttons & form ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
textarea { min-height: 84px; resize: vertical; }
.field { margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-side { background: linear-gradient(160deg, #066ecf, #04549f); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login-side h1 { font-size: 30px; margin-top: 18px; }
.login-side p { color: var(--side-text); max-width: 440px; }
.login-main { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-size: 22px; margin-bottom: 6px; }
.demo-box { margin-top: 22px; padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; }
.demo-box button { margin: 3px 3px 0 0; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 700; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.sidebar { background: linear-gradient(180deg, var(--side), var(--brand-dark, #04549f)); color: var(--side-text); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar .logo { color: #fff; padding: 0 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: var(--side-text); text-decoration: none; padding: 9px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-weight: 500; }
.nav a:hover { background: var(--side-active); color: #fff; }
.nav a.active { background: #fff; color: var(--brand); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.nav a.active .badge { background: var(--brand); }
.nav .badge { margin-left: auto; background: #fff; color: var(--brand); font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 99px; }
.about-mini { margin-top: auto; border-top: 1px solid rgba(255,255,255,.25); padding-top: 14px; font-size: 13px; }
.about-mini .name { color: #fff; font-weight: 600; }
.about-mini a { color: #fff; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center;
  font-weight: 700; flex: none; object-fit: cover; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; }
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--surface); border-bottom: 3px solid var(--brand); position: sticky; top: 0; z-index: 5; }
.topbar .menu-btn { display: none; }
.content { padding: 24px 28px 48px; max-width: 1200px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.demo-banner { background: var(--warn-soft); color: var(--warn); padding: 8px 28px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card + .card, .stack > * + * { margin-top: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat .v { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stat .l { color: var(--muted); font-size: 13px; font-weight: 500; }
.stat.bad .v { color: var(--bad); } .stat.ok .v { color: var(--ok); } .stat.warn .v { color: var(--warn); }
.cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.cols > .card { margin-top: 0; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }

/* ---------- Tables & lists ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item.click { cursor: pointer; }
.list-item.click:hover { background: var(--surface-2); margin: 0 -10px; padding: 12px 10px; border-radius: 8px; }
.list-item .t { font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.yangi, .pill.yuborildi { background: var(--info-soft); color: var(--info); }
.pill.jarayonda { background: var(--warn-soft); color: var(--warn); }
.pill.bajarildi { background: var(--brand-soft); color: var(--brand); }
.pill.yopildi, .pill.tasdiqlandi { background: var(--ok-soft); color: var(--ok); }
.pill.qaytarildi, .pill.overdue, .pill.yuqori, .pill.missing { background: var(--bad-soft); color: var(--bad); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
.filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.filters select, .filters input { width: auto; min-width: 150px; }
.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 80px; }
.progress > i { display: block; height: 100%; background: var(--ok); }
.report-body dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 12px; }
.report-body dd { margin: 3px 0 0; white-space: pre-wrap; }
.note { background: var(--surface-2); border-left: 3px solid var(--brand); padding: 8px 12px; border-radius: 6px; margin-top: 10px; white-space: pre-wrap; }
.note.bad { border-left-color: var(--bad); }

/* ---------- About ---------- */
.about-full { display: flex; gap: 22px; align-items: flex-start; }
.about-full .bio { white-space: pre-wrap; margin-top: 10px; }
.soon { opacity: .9; }
.soon .pill { margin-left: auto; }

/* ---------- KPI ---------- */
.kpi-table th { text-align: center; white-space: nowrap; }
.kpi-table th:first-child { text-align: left; }
.kpi-table td { text-align: center; }
.kpi-table td:first-child { text-align: left; white-space: nowrap; }
.kpi-max { font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.kpi-in { width: 64px; padding: 5px 6px; text-align: center; }
.kpi-in::placeholder { color: var(--muted); opacity: .9; }
.kpi-in.set { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.kpi-auto { color: var(--muted); }
.top-card { background: linear-gradient(135deg, var(--surface), var(--warn-soft)); }
.top-item { display: flex; gap: 12px; align-items: center; min-width: 220px; }
.top-score { font-size: 22px; font-weight: 700; color: var(--warn); }

/* ---------- KPI rejimlari, reja ---------- */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.seg button.active { background: var(--brand); color: #fff; }
tr.picked td { background: var(--warn-soft); }
.plan-in { min-height: 70px; font-size: 14px; }
.plan-table td { vertical-align: top; }

/* ---------- Hisobot eslatmasi ---------- */
.due-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 28px; font-weight: 500; }
.due-banner.due { background: var(--warn-soft); color: var(--warn); }
.due-banner.late { background: var(--bad-soft); color: var(--bad); }
.due-banner .btn { margin-left: auto; }
@media (max-width: 760px) { .due-banner { padding: 10px 16px; } }

/* ---------- Ma'lumotnoma ---------- */
.staff-photo { width: 150px; border-radius: 50%; flex: none; object-fit: cover; aspect-ratio: 1/1; border: 4px solid var(--brand-soft); }
.info-lines { white-space: pre-wrap; font-size: 14px; line-height: 1.7; }

/* ---------- Videolar ---------- */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.video-card { text-align: left; padding: 0; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); overflow: hidden; cursor: pointer; font: inherit; color: var(--text); box-shadow: var(--shadow); }
.video-card:hover { border-color: var(--brand); }
.video-thumb { aspect-ratio: 16/9; background: linear-gradient(135deg, #1c2c46, #1f5eff); position: relative; display: grid; place-items: center; }
.video-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video-thumb .play { position: relative; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.92); color: #1f5eff; display: grid; place-items: center; font-size: 20px; padding-left: 4px; }
.video-meta { padding: 12px 14px; }
.video-meta .t { font-weight: 600; }
.video-player { aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 12px; display: grid; place-items: center; }
.video-player video, .video-player iframe { width: 100%; height: 100%; border: 0; }
.video-player .empty { color: #ccc; }

/* ---------- Masalalar ---------- */
.posts-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.cat-list { padding: 8px; position: sticky; top: 80px; }
.cat-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px; border-radius: 8px; font: inherit; color: var(--text); cursor: pointer; text-align: left; }
.cat-row:hover { background: var(--surface-2); }
.cat-row.active { background: var(--brand-soft); font-weight: 600; }
.cat-dot { border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 14px; width: 30px; height: 30px; }
@media (max-width: 760px) {
  .posts-layout { grid-template-columns: 1fr; }
  .cat-list { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .cat-row { width: auto; white-space: nowrap; flex: none; }
}

/* ---------- Modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 26, .5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); margin-left: auto; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px); background: var(--text); color: var(--bg); padding: 10px 18px;
  border-radius: 10px; font-weight: 500; transition: transform .25s, opacity .25s; z-index: 60; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.err { background: var(--bad); color: #fff; }
.err-text { color: var(--bad); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .login-wrap { grid-template-columns: 1fr; }
  .login-side { padding: 28px 16px; }
  .login-side h1 { font-size: 24px; }
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .topbar { padding: 12px 16px; }
  .topbar .menu-btn { display: inline-flex; }
  .content { padding: 18px 16px 40px; }
  .demo-banner { padding: 8px 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .about-full { flex-direction: column; }
  .hide-sm { display: none; }
  .filters select, .filters input { flex: 1; min-width: 0; }
}

.avatar { background: var(--brand-soft); color: var(--brand); }
img.avatar { border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
.card { border-top: 3px solid transparent; }
.stat { border-top: 3px solid var(--brand); }
.page-head h1 { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page-head h1 { color: var(--text); } }

/* ---------- Muddat va qabul qiluvchi tanlagich, statistika ---------- */
.dl-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.dl-row { display: grid; grid-template-columns: 70px 1fr 90px 110px; gap: 8px; }
.dl-preview { margin-top: 6px; color: var(--muted); }
.dl-preview b { color: var(--brand); }
.rp { border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 300px; overflow-y: auto; background: var(--surface-2); }
.rp-top { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.rp-chk { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text); font-weight: 500; font-size: 14px; cursor: pointer; }
.rp-chk input { width: auto; }
.rp-group { padding: 6px 0; }
.rp-gh { padding: 4px 0; }
.rp-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 12px; padding-left: 24px; }
.rp-p .avatar { width: 26px; height: 26px; font-size: 11px; order: 2; }
.rp-p input { order: 1; }
.rp-p span { order: 3; }
.stats.st5 { grid-template-columns: repeat(5, 1fr); }
.stbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); min-width: 90px; }
.stbar i, .legend i { display: inline-block; height: 100%; }
.legend i { width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 10px; vertical-align: -1px; }
.sb-done { background: var(--ok); } .sb-review { background: var(--brand); } .sb-progress { background: #f0b04a; } .sb-failed { background: var(--bad); }
@media (max-width: 760px) { .stats.st5 { grid-template-columns: repeat(2, 1fr); } .dl-row { grid-template-columns: 60px 1fr 80px; } .dl-row [data-p=t] { grid-column: span 3; } }

  // ------------------------------------------------------------ SUPABASE
  function SupaDB() {
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    let meCache = null;
    const chk = ({ data, error }) => { if (error) throw new Error(trErr(error.message)); return data; };
    function trErr(m) {
      if (/Invalid login/i.test(m)) return "Login yoki parol noto'g'ri";
      if (/row-level security/i.test(m)) return "Bu amal uchun ruxsatingiz yo'q";
      if (/already registered|already been registered/i.test(m)) return "Bu login (telefon) allaqachon ro'yxatdan o'tgan";
      if (/anonymous sign-ins are disabled/i.test(m)) return "O'qituvchilar uchun kirish hali yoqilmagan. Monitoring bo'limiga murojaat qiling.";
      if (/rate limit|too many/i.test(m)) return "Juda ko'p so'rov. 5 daqiqa kutib, qayta bosing.";
      if (/Password should be/i.test(m)) return "Parol kamida 6 belgidan iborat bo'lishi kerak";
      return m;
    }
    async function loadMe() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return (meCache = null);
      meCache = chk(await sb.from("profiles").select("*").eq("id", user.id).single());
      return meCache;
    }
    return {
      mode: "supabase",
      async restore() { return loadMe(); },
      async needsSetup() {
        const { data, error } = await sb.rpc("has_founder");
        return !error && data === false;
      },
      async signUpFounder({ email, password, full_name }) {
        const res = chk(await sb.auth.signUp({ email: email.trim(), password, options: { data: { full_name } } }));
        if (!res.session) throw new Error("Hisob yaratildi. Emailingizga kelgan havolani bosing, so'ng kiring.");
        return loadMe();
      },
      async signIn(email, password) {
        chk(await sb.auth.signInWithPassword({ email: loginToEmail(email), password }));
        const p = await loadMe();
        if (p && !p.active) { await sb.auth.signOut(); throw new Error("Hisobingiz o'chirilgan. Asoschiga murojaat qiling."); }
        return p;
      },
      async signInTeacher({ full_name, filial }) {
        chk(await sb.auth.signInAnonymously({ options: { data: { full_name, filial } } }));
        return loadMe();
      },
      async signOut() { await sb.auth.signOut(); meCache = null; },
      async changePassword(pw) { chk(await sb.auth.updateUser({ password: pw })); return true; },
      async getAbout() { return chk(await sb.from("about").select("*").eq("id", 1).single()); },
      async saveAbout(a) { chk(await sb.from("about").update({ ...a, updated_at: new Date().toISOString() }).eq("id", 1)); return true; },
      async listProfiles() { return chk(await sb.from("profiles").select("*").order("full_name")); },
      async updateProfile(id, patch) { return chk(await sb.from("profiles").update(patch).eq("id", id).select().single()); },
      async createUser({ login, password, full_name, role, ceo_id, ...extra }) {

    people.forEach(p => { const k = p.role === "ceo" && S.me.role === "asoschi" ? "ceo" : deptOf(p); (groups[k] = groups[k] || []).push(p); });
    const gl = k => k === "ceo" ? "CEO'lar" : DEPTS[k]?.l || k;
    root.innerHTML = `<div class="rp-top"><label class="rp-chk"><input type="checkbox" data-all> <b>Hammaga (${people.length})</b></label><span class="small muted rp-count"></span></div>
      <div class="rp-groups">${Object.entries(groups).map(([k, list]) => `<div class="rp-group"><label class="rp-chk rp-gh"><input type="checkbox" data-g="${k}"> <b>${esc(gl(k))}</b> <span class="muted small">(${list.length})</span></label>
        <div class="rp-people">${list.map(p => `<label class="rp-chk rp-p">${avatar(p.full_name, photoOf(p))}<input type="checkbox" data-pid="${p.id}" data-pg="${k}" ${pre.includes(p.id) ? "checked" : ""}><span>${esc(p.full_name)}${p.id === S.me.id ? " (o'zim)" : ""}</span></label>`).join("")}</div></div>`).join("")}</div>`;
    const boxes = () => $$("[data-pid]", root);
    const sync = () => {
      Object.keys(groups).forEach(k => { const g = $$(`[data-pg="${k}"]`, root); const c = $(`[data-g="${k}"]`, root);
        c.checked = g.every(x => x.checked); c.indeterminate = !c.checked && g.some(x => x.checked); });
      const n = boxes().filter(x => x.checked).length; const a = $("[data-all]", root);
      a.checked = n === people.length; a.indeterminate = n > 0 && n < people.length;
      $(".rp-count", root).textContent = n ? `${n} kishi tanlandi` : "Hech kim tanlanmagan";
    };
    $("[data-all]", root).onchange = e => { boxes().forEach(x => x.checked = e.target.checked); sync(); };
    $$("[data-g]", root).forEach(c => c.onchange = () => { $$(`[data-pg="${c.dataset.g}"]`, root).forEach(x => x.checked = c.checked); sync(); });
    boxes().forEach(x => x.onchange = sync); sync();
    return () => boxes().filter(x => x.checked).map(x => x.dataset.pid);
  }

  function dashManager(page) {
    const t = today();
    const mem = members();
    const memIds = new Set(mem.map(p => p.id));
    const repToday = S.reports.filter(x => x.report_date === t && memIds.has(x.author_id));
    const submitted = new Set(repToday.map(x => x.author_id));
    const scopeTasks = S.tasks.filter(x => memIds.has(x.assigned_to) || x.assigned_to === S.me.id);
    const overdue = scopeTasks.filter(isOverdue);

    const toAccept = scopeTasks.filter(x => x.status === "bajarildi" && canManageTask(x));
    const expected = mem.filter(isWorkday);
    const missing = expected.filter(p => !submitted.has(p.id))
      .sort((a, b) => ({ late: 0, due: 1, early: 2 }[dueState(a)] - { late: 0, due: 1, early: 2 }[dueState(b)]));
    const pct = expected.length ? Math.round(expected.filter(p => submitted.has(p.id)).length / expected.length * 100) : 100;
    const dueLabel = p => { const st = dueState(p);
      return st === "late" ? pill("overdue", `Kechikdi (${sched(p).end} gacha edi)`) : st === "due" ? pill("jarayonda", `So'raldi · ${sched(p).end} gacha`) : `<span class="small muted">${askTime(p)} da so'raladi</span>`; };

    let teamTable;
    if (r() === "asoschi") {
      const ceos = S.profiles.filter(p => p.role === "ceo" && p.active);
      const groups = ceos.map(c => ({ label: c.full_name, team: [c, ...S.profiles.filter(p => p.ceo_id === c.id && p.active)], n: S.profiles.filter(p => p.ceo_id === c.id && p.active).length }));
      const own = S.profiles.filter(p => p.role === "xodim" && !p.ceo_id && p.active);
      if (own.length) groups.push({ label: "Shaxsiy bo'limim", team: own, n: own.length });
      teamTable = `<table><thead><tr><th>Jamoa</th><th>Xodimlar</th><th>Bugungi hisobot</th><th class="hide-sm">Faol topshiriq</th><th>Muddati o'tgan</th></tr></thead><tbody>
        ${groups.map(({ label, team, n }) => {
          const ids = new Set(team.map(p => p.id));
          const work = team.filter(isWorkday);
          const done = work.filter(p => submitted.has(p.id)).length;
          const act = S.tasks.filter(x => ids.has(x.assigned_to) && ACTIVE_T.includes(x.status)).length;
          const od = S.tasks.filter(x => ids.has(x.assigned_to) && isOverdue(x)).length;
          return `<tr><td><b>${esc(label)}</b></td><td>${n}</td>
            <td>${work.length ? `<div class="row"><div class="progress"><i style="width:${Math.round(done / work.length * 100)}%"></i></div>${done}/${work.length}</div>` : `<span class="small muted">Dam olish kuni</span>`}</td>
            <td class="hide-sm">${act}</td><td>${od ? pill("overdue", od) : "0"}</td></tr>`;
        }).join("") || `<tr><td colspan="5" class="empty">Hali jamoa yo'q</td></tr>`}</tbody></table>`;
    } else {
      teamTable = `<table><thead><tr><th>Xodim</th><th>Bugungi hisobot</th><th class="hide-sm">Faol topshiriq</th><th>Muddati o'tgan</th></tr></thead><tbody>
        ${mem.map(p => {
          const rep = repToday.find(x => x.author_id === p.id);
          const act = S.tasks.filter(x => x.assigned_to === p.id && ACTIVE_T.includes(x.status)).length;
          const od = S.tasks.filter(x => x.assigned_to === p.id && isOverdue(x)).length;
          return `<tr><td><b>${esc(p.full_name)}</b></td><td>${rep ? pill(rep.status, RSTAT[rep.status]) : !isWorkday(p) ? `<span class="small muted">Dam olish kuni</span>` : dueLabel(p)}</td>
            <td class="hide-sm">${act}</td><td>${od ? pill("overdue", od) : "0"}</td></tr>`;
        }).join("") || `<tr><td colspan="4" class="empty">Jamoangizda hali xodim yo'q</td></tr>`}</tbody></table>`;
    }
    function r() { return S.me.role; }

    page.innerHTML = head(`Xush kelibsiz, ${esc((S.me.full_name || "").split(" ")[0])}`, `Bugun: ${fmtDate(t)} · ${esc(ROLES[S.me.role])} paneli`) + `
      <div class="stats">
        ${stat("Bugun hisobot topshirdi", `${expected.filter(p => submitted.has(p.id)).length}/${expected.length}`, pct >= 80 ? "ok" : "warn")}
        ${stat("Tekshiruv kutayotgan hisobot", toReview.length)}
        ${stat("Qabul qilinishi kerak topshiriq", toAccept.length)}
        ${stat("Muddati o'tgan topshiriq", overdue.length, overdue.length ? "bad" : "ok")}
      </div>
      <div class="cols">
        <div class="card"><div class="card-head"><h2>${r() === "asoschi" ? "Jamoalar holati" : "Jamoam holati"}</h2></div><div class="table-wrap">${teamTable}</div></div>
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Bugun hisobot topshirmaganlar</h2><span class="spacer"></span>${pill("missing", missing.length)}</div>
            ${missing.length ? missing.slice(0, 14).map(p => `<div class="list-item"><div style="flex:1"><div class="t">${esc(p.full_name)}</div><div class="small muted">${esc(ROLES[p.role])}${p.ceo_id ? " · " + esc(nameOf(p.ceo_id)) : ""}</div></div>${dueLabel(p)}</div>`).join("") : `<div class="empty">Hammasi topshirdi 👏</div>`}
          </div>
          <div class="card"><div class="card-head"><h2>Muddati o'tgan topshiriqlar</h2></div>
            ${overdue.length ? overdue.slice(0, 8).map(taskLine).join("") : `<div class="empty">Muddati o'tgan topshiriq yo'q</div>`}
          </div>
        </div>
      </div>${recentPosts()}`;
    bindTaskLines(page); bindPostLines(page);
  }

  function dashStaff(page) {
    const t = today();
    const mine = S.tasks.filter(x => x.assigned_to === S.me.id);
    const active = mine.filter(x => ACTIVE_T.includes(x.status)).sort((a, b) => (a.due_date || "9") < (b.due_date || "9") ? -1 : 1);
    const od = mine.filter(isOverdue);
    const myReps = S.reports.filter(x => x.author_id === S.me.id);
    const rep = myReps.find(x => x.report_date === t);
    const month = t.slice(0, 7);
    const monthReps = myReps.filter(x => x.report_date.startsWith(month));
    page.innerHTML = head(`Xush kelibsiz, ${esc((S.me.full_name || "").split(" ")[0])}`, `Bugun: ${fmtDate(t)} · Rahbaringiz: ${esc(S.me.ceo_id ? nameOf(S.me.ceo_id) : (S.profiles.find(p => p.role === "asoschi")?.full_name || "Asoschi"))}`) + `
      <div class="stats">
        ${stat("Faol topshiriqlar", active.length)}
        ${stat("Muddati o'tgan", od.length, od.length ? "bad" : "ok")}
        ${stat("Shu oy hisobotlar", monthReps.length)}
        ${stat("Tasdiqlangan", monthReps.filter(x => x.status === "tasdiqlandi").length, "ok")}
      </div>
      <div class="cols">
        <div class="card"><div class="card-head"><h2>Topshiriqlarim</h2><span class="spacer"></span><a href="#/topshiriqlar" class="btn sm">Barchasi</a></div>
          ${active.length ? active.slice(0, 8).map(taskLine).join("") : `<div class="empty">Faol topshiriq yo'q</div>`}</div>
        <div class="card"><div class="card-head"><h2>Bugungi hisobot</h2></div>
          ${rep ? `<p>${pill(rep.status, RSTAT[rep.status])}</p><p class="muted small" style="white-space:pre-wrap">${esc(rep.done)}</p>
              ${rep.reviewer_note ? `<div class="note ${rep.status === "qaytarildi" ? "bad" : ""}"><b>Izoh:</b> ${esc(rep.reviewer_note)}</div>` : ""}
              <p><a class="btn sm" href="#/hisobotlar">${rep.status === "tasdiqlandi" ? "Ko'rish" : "Tahrirlash"}</a></p>`
            : `<p class="muted">Bugun hali hisobot yozmadingiz.</p><a class="btn primary" href="#/hisobotlar">Hisobot yozish</a>`}
          <p class="small muted" style="margin-bottom:0">Ish jadvalingiz: ${sched(S.me).label}, ${sched(S.me).start}–${sched(S.me).end}.
            ${isWorkday(S.me) ? `Hisobot soat <b>${askTime(S.me)}</b> dan so'raladi.` : "Bugun dam olish kuningiz."}</p>
          ${"Notification" in window && Notification.permission === "default" ? `<button class="btn sm" id="notif-on" style="margin-top:10px">🔔 Eslatmalarni yoqish</button>` : ""}
        </div>
      </div>${recentPosts()}`;
    bindTaskLines(page); bindPostLines(page);
    const nb = $("#notif-on", page);
    if (nb) nb.onclick = async () => { try { const r = await Notification.requestPermission(); toast(r === "granted" ? "Eslatmalar yoqildi" : "Eslatmalar yoqilmadi"); } catch (e) {} nb.remove(); };
  }

  function dashGuest(page) {
    const r = S.me.role;
    const cards = r === "rahbar"
      ? [["video", "Uslubiy videolar va maqolalar", "Monitoring bilan ishlash usullari va asosiy muammolar tahlili."],
         ["chat", "Savol berish", "Monitoring bo'limiga savolingizni yuboring va javob oling."],
         ["meet", "Zoom uchrashuv belgilash", "Monitoring bo'limi bilan onlayn uchrashuv vaqtini tanlang."],
         ["report", "Umumiy natijalar", "Maktab bo'yicha umumiy monitoring ko'rsatkichlari."]]
      : [["chat", "Monitoringga savol", "Savolingizni yuboring (xohlasangiz, ismsiz)."]];
    const vids = S.videos.slice(0, 6);
    page.innerHTML = head(`Xush kelibsiz, ${esc((S.me.full_name || "").split(" ")[0])}`, `${esc(ROLES[r])} sahifasi${S.me.filial ? " · " + esc(S.me.filial) : ""}`) + `
      <div class="card" style="margin-bottom:16px">${aboutBlock(S.about)}</div>
      <div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Siz uchun videolar</h2><span class="spacer"></span><a class="btn sm" href="#/videolar">Barchasi</a></div>
        ${vids.length ? `<div class="video-grid">${vids.map(videoCard).join("")}</div>` : `<div class="empty">Hozircha video yo'q</div>`}</div>
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        ${cards.filter(c => c[0] !== "video").map(([i, t, d]) => `<div class="stat soon"><div class="row">${ic(i, 22)}${pill("", "Tez orada")}</div><h3 style="margin-top:10px">${t}</h3><p class="small muted" style="margin:4px 0 0">${d}</p></div>`).join("")}
      </div>`;
    bindVideoCards(page);
  }

  // ---- task line (used on dashboards)
  function taskLine(t) {
    return `<div class="list-item click" data-task="${t.id}"><div style="flex:1;min-width:0">
      <div class="t">${esc(t.title)}</div>
      <div class="small muted">${esc(CATS[t.category] || t.category)}${t.assigned_to !== S.me.id ? " · " + esc(nameOf(t.assigned_to)) : ""} · muddat: ${fmtDue(t.due_date, t.due_time)}</div></div>
      ${isOverdue(t) ? pill("overdue", "Muddati o'tgan") : pill(t.status, TSTAT[t.status])}</div>`;
  }
  const bindTaskLines = root => $$("[data-task]", root).forEach(el => el.onclick = () => openTask(+el.dataset.task || el.dataset.task));

  // ---- Topshiriqlar
  PAGES.topshiriqlar = page => {
    const f = S.ui.tf || (S.ui.tf = { status: "faol", who: "", cat: "" });
    const mgr = isManager();
    let list = S.tasks.slice();
    if (S.me.role === "xodim") list = list.filter(t => t.assigned_to === S.me.id);
    if (f.status === "faol") list = list.filter(t => ACTIVE_T.includes(t.status) || t.status === "bajarildi");
    else if (f.status === "kechikkan") list = list.filter(isOverdue);
    else if (f.status) list = list.filter(t => t.status === f.status);
    if (f.who) list = list.filter(t => t.assigned_to === f.who);
    if (f.cat) list = list.filter(t => t.category === f.cat);
    list.sort((a, b) => (isOverdue(b) - isOverdue(a)) || ((a.due_date || "9") < (b.due_date || "9") ? -1 : 1));
    const people = mgr ? assignable() : [];
    page.innerHTML = head(S.me.role === "xodim" ? "Topshiriqlarim" : "Topshiriqlar",
      mgr ? "Topshiriq bering, bajarilishini kuzating va natijani qabul qiling." : "Sizga berilgan topshiriqlar.",
      mgr ? `<button class="btn primary" id="new-task">+ Yangi topshiriq</button>` : "") + `
      <div class="filters">
        <select id="f-status"><option value="faol">Faol</option><option value="kechikkan">Muddati o'tgan</option>
          ${Object.entries(TSTAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}<option value="">Barchasi</option></select>
        ${mgr ? `<select id="f-who"><option value="">Barcha ijrochilar</option>${people.map(p => `<option value="${p.id}">${esc(p.full_name)}</option>`).join("")}</select>` : ""}
        <select id="f-cat"><option value="">Barcha turlar</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      </div>
      <div class="card"><div class="table-wrap">
        ${list.length ? `<table><thead><tr><th>Topshiriq</th>${mgr ? "<th>Ijrochi</th>" : ""}<th>Muddat</th><th>Holat</th><th class="hide-sm">Muhimlik</th></tr></thead><tbody>
          ${list.map(t => `<tr class="click" data-task="${t.id}"><td><b>${esc(t.title)}</b><div class="small muted">${esc(CATS[t.category] || t.category)}${mgr ? "" : " · beruvchi: " + esc(nameOf(t.created_by))}</div></td>
            ${mgr ? `<td>${esc(nameOf(t.assigned_to))}</td>` : ""}<td>${t.due_date ? fmtDate(t.due_date) + (t.due_time ? " " + t.due_time : "") : "—"} ${isOverdue(t) ? pill("overdue", "kechikdi") : ""}</td>
            <td>${pill(t.status, TSTAT[t.status])}</td><td class="hide-sm">${t.priority === "yuqori" ? pill("yuqori", "Yuqori") : esc(PRIO[t.priority])}</td></tr>`).join("")}
          </tbody></table>` : `<div class="empty">Bu filtr bo'yicha topshiriq yo'q</div>`}
      </div></div>`;
    $("#f-status").value = f.status;
    if ($("#f-who")) $("#f-who").value = f.who;
    $("#f-cat").value = f.cat;
    ["status", "who", "cat"].forEach(k => { const el = $("#f-" + k); if (el) el.onchange = () => { f[k] = el.value; PAGES.topshiriqlar(page); }; });
    if ($("#new-task")) $("#new-task").onclick = () => taskForm();
    $$("tr[data-task]", page).forEach(el => el.onclick = () => openTask(+el.dataset.task || el.dataset.task));
  };

  function taskForm(t) {
    const people = assignable();
    const m = openModal(t ? "Topshiriqni tahrirlash" : "Yangi topshiriq", `
      <form id="tform">
        <div class="field"><label>Nomi *</label><input name="title" required maxlength="200" value="${esc(t?.title)}"></div>
        <div class="field"><label>Tavsif</label><textarea name="description" placeholder="Nima qilish kerak, qanday natija kutilmoqda">${esc(t?.description)}</textarea></div>
        ${t ? `<div class="field"><label>Ijrochi</label><select name="assigned_to">${people.map(p => `<option value="${p.id}" ${t.assigned_to === p.id ? "selected" : ""}>${esc(p.full_name)}</option>`).join("")}</select></div>`
          : `<div class="field"><label>Kimga yuboriladi * <span class="muted">(bo'lim yoki alohida xodimlar)</span></label><div id="t-rp" class="rp"></div></div>`}
        <div class="field"><label>Qachongacha</label><div id="t-dl"></div></div>
        <div class="grid2">
          <div class="field"><label>Turi</label><select name="category">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${t?.category === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
          <div class="field"><label>Muhimlik</label><select name="priority">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${(t?.priority || "oddiy") === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="err-text" id="t-err"></div>
      </form>`, `<button class="btn" data-close>Bekor qilish</button><button class="btn primary" id="tsave">${t ? "Saqlash" : "Yuborish"}</button>`);
    $(".modal", $("#modal-root")).style.maxWidth = "680px";
    const getDl = deadlinePicker($("#t-dl", m), t ? (t.due_date || null) : window.dateUtil.addDays(1), t?.due_time || "");
    const getRp = t ? null : recipientPicker($("#t-rp", m), people);
    $("#tsave", m).onclick = async e => {
      const form = $("#tform", m); if (!form.reportValidity()) return;
      const d = Object.fromEntries(new FormData(form)); Object.assign(d, getDl());
      if (t) { await act(() => db.updateTask(t.id, d), "Saqlandi"); await refresh(); render(); return; }
      const ids = getRp(); if (!ids.length) return ($("#t-err", m).textContent = "Kamida bitta xodimni tanlang");
      e.target.disabled = true; e.target.textContent = "Yuborilmoqda…";
      let ok = 0;
      for (const id of ids) { try { await db.createTask({ ...d, assigned_to: id }); ok++; } catch (err) { $("#t-err", m).textContent = err.message; } }
      toast(`${ok} kishiga topshiriq yuborildi`); await refresh(); render();
    };
  }

  function openTask(id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    const mine = t.assigned_to === S.me.id;
    const manage = canManageTask(t);
    let foot = "";
    if (mine && ["yangi", "qaytarildi"].includes(t.status)) foot += `<button class="btn" data-st="jarayonda">Boshlash</button>`;
    if (mine && ACTIVE_T.includes(t.status)) foot += `<button class="btn primary" id="t-done">Bajarildi deb belgilash</button>`;
    if (manage && t.status === "bajarildi" && !(mine && S.me.role !== "asoschi" && t.created_by !== S.me.id)) {
      foot += `<button class="btn bad" id="t-return">Qaytarish</button><button class="btn ok" data-st="yopildi">Qabul qilish</button>`;
    }
    if (manage) foot = `<button class="btn sm" id="t-edit">Tahrirlash</button>${(S.me.role === "asoschi" || t.created_by === S.me.id) ? `<button class="btn sm bad" id="t-del">O'chirish</button>` : ""}<span class="spacer"></span>` + foot;
    const m = openModal(esc(t.title), `
      <div class="row" style="margin-bottom:12px">${pill(t.status, TSTAT[t.status])} ${isOverdue(t) ? pill("overdue", "Muddati o'tgan") : ""} ${pill("", CATS[t.category] || t.category)} ${t.priority === "yuqori" ? pill("yuqori", "Muhim") : ""}</div>
      ${t.description ? `<p style="white-space:pre-wrap;margin-top:0">${esc(t.description)}</p>` : ""}
      <table class="small"><tbody>
        <tr><td class="muted">Ijrochi</td><td><b>${esc(nameOf(t.assigned_to))}</b></td></tr>
        <tr><td class="muted">Beruvchi</td><td>${esc(nameOf(t.created_by))}</td></tr>
        <tr><td class="muted">Muddat</td><td>${fmtDue(t.due_date, t.due_time)}</td></tr>
        <tr><td class="muted">Berilgan sana</td><td>${fmtDate(t.created_at)}</td></tr></tbody></table>
      ${t.result_note ? `<div class="note"><b>Ijrochi natijasi:</b>\n${esc(t.result_note)}</div>` : ""}
      ${t.review_note ? `<div class="note bad"><b>Rahbar izohi:</b>\n${esc(t.review_note)}</div>` : ""}
      <div id="t-extra"></div>`, foot);
    const reload = async () => { await refresh(); render(); };
    $$("[data-st]", m).forEach(b => b.onclick = async () => { await act(() => db.updateTask(t.id, { status: b.dataset.st }), "Holat yangilandi"); reload(); });
    const done = $("#t-done", m);
    if (done) done.onclick = () => {
      $("#t-extra", m).innerHTML = `<div class="field" style="margin-top:14px"><label>Natija haqida qisqacha *</label><textarea id="res" placeholder="Nima qilindi, qanday natija">${esc(t.result_note)}</textarea></div>`;
      done.textContent = "Yuborish";
      done.onclick = async () => {
        const v = $("#res", m).value.trim(); if (!v) return toast("Natijani yozing", true);
        await act(() => db.updateTask(t.id, { status: "bajarildi", result_note: v }), "Tekshiruvga yuborildi"); reload();
      };
    };
    const ret = $("#t-return", m);
    if (ret) ret.onclick = () => {
      $("#t-extra", m).innerHTML = `<div class="field" style="margin-top:14px"><label>Nima uchun qaytarilmoqda? *</label><textarea id="rn"></textarea></div>`;
      ret.textContent = "Qaytarishni tasdiqlash";
      ret.onclick = async () => {
        const v = $("#rn", m).value.trim(); if (!v) return toast("Izoh yozing", true);
        await act(() => db.updateTask(t.id, { status: "qaytarildi", review_note: v }), "Qaytarildi"); reload();
      };
    };
    if ($("#t-edit", m)) $("#t-edit", m).onclick = () => taskForm(t);
    if ($("#t-del", m)) $("#t-del", m).onclick = async e => {
      if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Rostdan o'chirilsinmi?"; return; }
      await act(() => db.deleteTask(t.id), "O'chirildi"); reload();
    };
  }

  // ---- Hisobotlar
  PAGES.hisobotlar = page => {
    const r = S.me.role;
    const tabs = r === "xodim" ? ["mine"] : r === "ceo" ? ["team", "mine"] : ["team"];
    let tab = S.ui.rtab && tabs.includes(S.ui.rtab) ? S.ui.rtab : tabs[0];
    const labels = { mine: "Mening hisobotim", team: r === "asoschi" ? "Barcha hisobotlar" : "Jamoa hisobotlari" };
    page.innerHTML = head(r === "xodim" ? "Kunlik hisobot" : "Hisobotlar", r === "xodim" ? "Har kuni ish yakunida to'ldiring." : "Kunlik hisobotlarni ko'ring va tasdiqlang.") +
      (tabs.length > 1 ? `<div class="tabs">${tabs.map(k => `<button data-tab="${k}" class="${k === tab ? "active" : ""}">${labels[k]}</button>`).join("")}</div>` : "") +
      `<div id="rbody"></div>`;
    $$("[data-tab]", page).forEach(b => b.onclick = () => { S.ui.rtab = b.dataset.tab; PAGES.hisobotlar(page); });
    (tab === "mine" ? myReports : teamReports)($("#rbody", page));
  };

  function myReports(root) {
    const date = S.ui.rdate || today();
    const mine = S.reports.filter(x => x.author_id === S.me.id).sort((a, b) => a.report_date < b.report_date ? 1 : -1);
    const rep = mine.find(x => x.report_date === date);
    const locked = rep && rep.status === "tasdiqlandi";
    root.innerHTML = `<div class="cols">
      <div class="card"><div class="card-head"><h2>${rep ? "Hisobot" : "Yangi hisobot"}</h2><span class="spacer"></span>${rep ? pill(rep.status, RSTAT[rep.status]) : ""}</div>
        ${rep?.reviewer_note ? `<div class="note ${rep.status === "qaytarildi" ? "bad" : ""}" style="margin:0 0 14px"><b>Rahbar izohi:</b> ${esc(rep.reviewer_note)}</div>` : ""}
        <form id="rform">
          <div class="grid2">
            <div class="field"><label>Sana</label><input type="date" name="report_date" value="${date}" max="${today()}" required></div>
            <div class="field"><label>Sarflangan vaqt (soat)</label><input type="number" name="hours" min="0" max="24" step="0.5" value="${esc(rep?.hours ?? "")}" ${locked ? "disabled" : ""}></div>
          </div>
          <div class="field"><label>Bugun nima qilindi? *</label><textarea name="done" required ${locked ? "disabled" : ""} placeholder="Masalan: 7-A sinfda matematika darsi kuzatildi, kuzatuv varaqasi to'ldirildi…">${esc(rep?.done)}</textarea></div>
          <div class="field"><label>Qanday muammolar uchradi?</label><textarea name="problems" ${locked ? "disabled" : ""}>${esc(rep?.problems)}</textarea></div>
          <div class="field"><label>Ertangi reja</label><textarea name="plan" ${locked ? "disabled" : ""}>${esc(rep?.plan)}</textarea></div>
          ${locked ? `<p class="muted small">Bu hisobot tasdiqlangan, o'zgartirib bo'lmaydi.</p>` : `<button class="btn primary" type="submit">${rep ? "Yangilash" : "Yuborish"}</button>`}
        </form></div>
      <div class="card"><div class="card-head"><h2>Oldingi hisobotlarim</h2></div>
        ${mine.length ? mine.slice(0, 30).map(x => `<div class="list-item click" data-d="${x.report_date}"><div style="flex:1"><div class="t">${fmtDate(x.report_date)}</div>
          <div class="small muted">${esc((x.done || "").slice(0, 70))}${(x.done || "").length > 70 ? "…" : ""}</div></div>${pill(x.status, RSTAT[x.status])}</div>`).join("") : `<div class="empty">Hali hisobot yo'q</div>`}
      </div></div>`;
    const f = $("#rform", root);
    f.report_date.onchange = () => { S.ui.rdate = f.report_date.value; myReports(root); };
    f.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      d.done = d.done.trim(); if (!d.done) return toast("Nima qilinganini yozing", true);
      d.hours = d.hours === "" ? 0 : +d.hours;
      await act(() => db.saveMyReport(d), "Hisobot yuborildi");
      await refresh(); render();
    };
    $$("[data-d]", root).forEach(el => el.onclick = () => { S.ui.rdate = el.dataset.d; myReports(root); window.scrollTo(0, 0); });
  }

  function teamReports(root) {
    const date = S.ui.tdate || today();
    const ceoF = S.ui.tceo || "";
    let mem = members();
    if (ceoF === "own") mem = mem.filter(p => p.role === "xodim" && !p.ceo_id);
    else if (ceoF) mem = mem.filter(p => p.id === ceoF || p.ceo_id === ceoF);
    const reps = S.reports.filter(x => x.report_date === date);
