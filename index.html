  // ---- KPI va reyting
  const KPI_TPL = {
    umumiy: { title: "Umumiy nazorat xodimlari", items: [
      { k: "reja", l: "Tasdiqlangan kuzatuv rejasini bajarish", s: "Reja", max: 25, auto: "reja", d: "Rejaga nisbatan bajarilgan, jurnalga qayd etilgan kuzatuvlar" },
      { k: "dalil", l: "Muammolar asosliligi va dalillar sifati", s: "Dalil", max: 25, d: "Video/vaqt, holat tavsifi, xolislik va tekshiruvga yaroqlilik" },
      { k: "tasnif", l: "Muammolarni to'g'ri tasniflash va yetkazish", s: "Tasnif", max: 15, hint: "posts", d: "Toifa, mas'ul shaxs va belgilangan muddatda xabar" },
      { k: "filial", l: "Filiallar bo'yicha ijroni kuzatish", s: "Filial", max: 10, hint: "resolved", d: "Ochiq holatlar reyestri va takroriy eslatma/eskalatsiya" },
      { k: "hisobot", l: "Hisobot aniqligi va muddatlari", s: "Hisobot", max: 10, auto: "hisobot", d: "Belgilangan shakl, tekshiruvga mos raqam va muddat" },
      { k: "etika", l: "Korporativ intizom va kasbiy etika", s: "Etika", max: 10, d: "Davomat, ichki tartib, xolis aloqa, kiyinish qoidalari" },
      { k: "tashabbus", l: "Asosli tashabbus va yaxshilashga hissa", s: "Tashab.", max: 5, hint: "taklif", d: "Tasdiqlangan taklif yoki jarayonni yaxshilashga dalilli hissa" }] },
    akademik: { title: "Akademik kuzatuv xodimlari", items: [
      { k: "reja", l: "Dars kuzatuvlari rejasini bajarish", s: "Reja", max: 20, auto: "reja", d: "Tasdiqlangan kuzatuvlar soni va to'liq varaqalar" },
      { k: "baholash", l: "Darslarni xolis va aniq baholash", s: "Baholash", max: 30, d: "Rubrikaga mos ball, dalilli izoh, qayta baholash muvofiqligi" },
      { k: "tahlil", l: "Tahlil va metodik tavsiya sifati", s: "Tahlil", max: 15, d: "Konkret holat, pedagogik xulosa, bajarilishi mumkin bo'lgan tavsiya" },
      { k: "hisobot", l: "Hisobot va hujjatlashtirish", s: "Hisobot", max: 10, auto: "hisobot", d: "To'liq, tekshiruvga yaroqli va o'z vaqtida hisobot" },
      { k: "qayta", l: "Qayta kuzatuv va o'zgarishni qayd etish", s: "Qayta", max: 10, d: "Belgilangan holatlar bo'yicha taqqoslash va natijani qayd qilish" },
      { k: "etika", l: "Korporativ intizom va kasbiy etika", s: "Etika", max: 10, d: "Davomat, axloq, maxfiylik, kiyinish qoidalari" },
      { k: "tashabbus", l: "Asosli tashabbus va yaxshilashga hissa", s: "Tashab.", max: 5, hint: "taklif", d: "Amalda foydali taklif yoki sifatni yaxshilashga hujjatli hissa" }] }
  };
  const CEO_EXTRA = { k: "jamoa", l: "Jamoaning faolligi", s: "Jamoa", max: 20, ceoOnly: true, d: "Hozircha asoschi qo'yadi, keyinchalik avtomatlashadi" };
  const DEPTS = {
    administratsiya: { l: "Administratsiya", tpl: "umumiy" },
    intizomiy: { l: "Intizomiy nazorat", tpl: "umumiy" },
    akademik: { l: "Akademik nazorat", tpl: "akademik" },
    texnik: { l: "Texnik nazorat", tpl: "umumiy" }
  };
  function deptOf(p) {
    if (!p) return "administratsiya";
    if (p.role === "asoschi") return "administratsiya";
    if (p.role === "ceo") return DEPTS[p.bolim] ? p.bolim : "intizomiy";
    const c = p.ceo_id && person(p.ceo_id);
    return c ? deptOf(c) : (DEPTS[p.bolim] ? p.bolim : "administratsiya");
  }
  const itemsFor = p => { const it = KPI_TPL[DEPTS[deptOf(p)].tpl].items; return p.role === "ceo" ? [...it, CEO_EXTRA] : it; };
  const KPI_ANCHOR = "2026-10-19";
  const addD = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return window.dateUtil.localDate(d); };
  const dayDiff = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
  const periodOf = iso => addD(KPI_ANCHOR, Math.floor(dayDiff(KPI_ANCHOR, iso) / 14) * 14);
  const periodLabel = ps => `${fmtDate(ps)} – ${fmtDate(addD(ps, 13))}`;
  // ---- Bo'lim eslatma-topshiriqlari: yordamchilar
  const recipientsOf = t => S.profiles.filter(p => p.active && ["xodim", "ceo"].includes(p.role) &&
    (t.recipients && t.recipients.length ? t.recipients.includes(p.id) : (t.depts || []).includes(deptOf(p))));
  const dtStatus = (t, p) => S.dstatus.find(r => r.task_id === t.id && r.user_id === p.id) || { status: "kutilmoqda", self_done: false, self_note: "" };
  const dtDate = t => t.due_date || window.dateUtil.localDate(new Date(t.created_at));
  const DTS = { kutilmoqda: "Tasdiq kutilmoqda", bajarildi: "Bajarildi", bajarilmadi: "Bajarilmadi" };
  const DTS_CLS = { kutilmoqda: "yangi", bajarildi: "tasdiqlandi", bajarilmadi: "qaytarildi" };
  const inDays = (iso, from, to) => iso >= from && iso <= to;
  const localOf = ts => window.dateUtil.localDate(new Date(ts));

  // Har qanday oraliq uchun avtomatik ko'rsatkich (0..1)
  function rangeAuto(p, kind, from, to, reps = S.reports) {
    const t = today();
    if (kind === "reja" || kind === "eslatma") {
      let list = kind === "reja" ? S.tasks.filter(x => x.assigned_to === p.id && inDays(x.due_date || localOf(x.created_at), from, to)) : [];
      if (deptOf(p) === "akademik" && list.some(x => x.category === "dars_kuzatuvi")) list = list.filter(x => x.category === "dars_kuzatuvi");
      const dts = S.dtasks.filter(x => inDays(dtDate(x), from, to) && recipientsOf(x).some(r => r.id === p.id));
      const total = list.length + dts.length;
      if (!total) return { r: null, why: kind === "reja" ? "Bu davrda topshiriq yo'q" : "Eslatma yo'q" };
      const done = list.reduce((a, x) => a + (x.status === "yopildi" ? 1 : x.status === "bajarildi" ? 0.5 : 0), 0)
        + dts.filter(x => dtStatus(x, p).status === "bajarildi").length;
      return { r: done / total, why: `${total} ta topshiriq/eslatmadan ${done} tasi bajarilgan` };
    }
    if (kind === "hisobot") {
      const sc = sched(p); let days = 0, got = 0;
      const startD = p.start_date && p.start_date > from ? p.start_date : from;
      for (let d = startD; d <= to && d <= t; d = addD(d, 1)) {
        const dow = ((new Date(d + "T12:00:00").getDay() + 6) % 7) + 1;
        if (!sc.days.includes(dow)) continue;
        const r = reps.find(x => x.author_id === p.id && x.report_date === d);
        if (d === t && !r) continue;
        days++; if (r) got += r.status === "qaytarildi" ? 0.5 : 1;
      }
      if (!days) return { r: null, why: "Hali ish kuni o'tmagan" };
      return { r: got / days, why: `${days} ish kunidan ${got} ta hisobot` };
    }
    return { r: null };
  }
  function autoValue(p, item, ps, reps) {
    const a = rangeAuto(p, item.auto, ps, addD(ps, 13), reps);
    return { v: a.r === null ? null : Math.round(item.max * a.r * 10) / 10, why: a.why };
  }
  function hintFor(p, item, ps) {
    const pe = addD(ps, 13);
    const mine = S.posts.filter(x => x.author_id === p.id && x.created_at && inDays(localOf(x.created_at), ps, pe));
    if (item.hint === "posts") return `${mine.length} ta masala kiritgan`;
    if (item.hint === "resolved") return `${mine.filter(x => x.status === "hal_qilindi").length} ta masala hal qilingan`;
    if (item.hint === "taklif") return `${mine.filter(x => x.category === "taklif").length} ta taklif`;
    return "";
  }
  function kpiRow(p, ps, K, awardId, reps) {
    const items = itemsFor(p);
    const picked = awardId === p.id;
    const cells = items.map(it => {
      const man = K.scores.find(r => r.period_start === ps && r.user_id === p.id && r.criterion === it.k);
      const au = it.auto ? autoValue(p, it, ps, reps) : { v: null };
      const val = picked ? it.max : man && man.score !== null ? +man.score : au.v;
      return { it, man, au, val };
    });
    const sum = cells.reduce((a, c) => a + (c.val || 0), 0);
    const maxT = items.reduce((a, it) => a + it.max, 0);
    const pct = Math.round(sum / maxT * 1000) / 10;
    const fin = K.finals.find(r => r.period_start === ps && r.user_id === p.id);
    const final = picked ? 100 : fin && fin.final_score !== null ? +fin.final_score : pct;
    return { p, cells, sum: Math.round(sum * 10) / 10, maxT, pct, final, overridden: !!fin && !picked, picked, has: sum > 0 || !!fin || picked };
  }
  // G'oliblar: reytingdagi 1-o'rin + asoschi tanlovi (bo'lsa), aks holda eng yaxshi 2 natija
  function winners(rows, awardId) {
    const rated = rows.filter(x => x.has && !x.picked).sort((a, b) => b.final - a.final);
    const pick = rows.find(x => x.picked);
    return pick ? [...rated.slice(0, 1), pick] : rated.slice(0, 2);
  }
  const canRate = p => S.me.role === "asoschi" || (S.me.role === "ceo" && p.ceo_id === S.me.id);
  const bosqichNo = ps => dayDiff(KPI_ANCHOR, ps) / 14 + 1;
  const weekOf = iso => { const dow = ((new Date(iso + "T12:00:00").getDay() + 6) % 7); return addD(iso, -dow); };

  function kpiTabs() {
    const r = S.me.role;
    const staffAll = S.profiles.filter(p => p.active && ["xodim", "ceo"].includes(p.role));
    if (r === "asoschi") return [...Object.keys(DEPTS).map(k => ({ id: k, l: DEPTS[k].l, rows: staffAll.filter(p => p.role === "xodim" && deptOf(p) === k) })),
      { id: "ceo", l: "CEO'lar", rows: staffAll.filter(p => p.role === "ceo") }];
    if (r === "ceo") return [{ id: "team", l: "Jamoam — " + DEPTS[deptOf(S.me)].l, rows: members() }, { id: "me", l: "Mening natijam", rows: [S.me] }];
    return [{ id: "me", l: "Mening natijam", rows: [S.me] }];
  }
  const rankPool = () => S.me.role === "asoschi" ? S.profiles.filter(p => p.active && p.role === "xodim") : S.me.role === "ceo" ? members() : [];

  PAGES.kpi = async page => {
    const mode = S.ui.kpiMode || "bosqich";
    const modes = [["kun", "Kunlik"], ["hafta", "Haftalik"], ["bosqich", "2 haftalik (bosqich)"], ["yil", "Yillik"]];
    const modeBar = `<div class="seg">${modes.map(([k, l]) => `<button data-km="${k}" class="${k === mode ? "active" : ""}">${l}</button>`).join("")}</div>`;
    page.innerHTML = head("KPI va reyting", "Har 2 haftada yangi bosqich. Bosqichning 1-o'rini va asoschi tanlovi taqdirlanadi.") + modeBar + `<div id="kpi-body"><div class="card empty">Yuklanmoqda…</div></div>`;
    $$("[data-km]", page).forEach(b => b.onclick = () => { S.ui.kpiMode = b.dataset.km; PAGES.kpi(page); });
    const body = $("#kpi-body", page);
    try { await ({ bosqich: kpiBosqich, hafta: kpiShort, kun: kpiShort, yil: kpiYear })[mode](body, mode); }
    catch (e) { body.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  };
  const tabBar = (tabs, tab) => tabs.length > 1 ? `<div class="tabs" style="margin-top:16px">${tabs.map(t => `<button data-kt="${t.id}" class="${t.id === tab.id ? "active" : ""}">${esc(t.l)}</button>`).join("")}</div>` : "";
  const bindTabs = (root, rerun) => $$("[data-kt]", root).forEach(b => b.onclick = () => { S.ui.kpiTab = b.dataset.kt; rerun(); });

  async function kpiBosqich(body) {
    const ps = S.ui.kpiP || periodOf(today());
    const [K, aw] = await Promise.all([db.listKpi(ps), db.listAwards(ps, ps)]);
    const awardId = aw[0]?.user_id || null;
    const cur = periodOf(today());
    const periods = []; for (let i = 0; i < 26; i++) { const x = addD(cur, -14 * i); if (x >= KPI_ANCHOR) periods.push(x); }
    const tabs = kpiTabs(); const tab = tabs.find(t => t.id === S.ui.kpiTab) || tabs[0];
    const pool = rankPool().map(p => kpiRow(p, ps, K, awardId));
    const win = winners(pool, awardId);
    const rows = tab.rows.map(p => kpiRow(p, ps, K, awardId)).sort((a, b) => b.final - a.final);
    const items = rows.length ? rows[0].cells.map(c => c.it) : (tab.id === "ceo" ? [...KPI_TPL.umumiy.items, CEO_EXTRA] : KPI_TPL[DEPTS[tab.id]?.tpl || DEPTS[deptOf(S.me)].tpl].items);
    const isA = S.me.role === "asoschi";
    body.innerHTML = `<div class="row" style="margin:14px 0"><select id="kpi-p" style="width:auto">${periods.map(x => `<option value="${x}" ${x === ps ? "selected" : ""}>${bosqichNo(x)}-bosqich: ${periodLabel(x)}${x === cur ? " (joriy)" : ""}</option>`).join("")}</select></div>
      ${win.length || isA ? `<div class="card top-card"><div class="card-head"><h2>🏆 ${bosqichNo(ps)}-bosqich g'oliblari</h2><span class="spacer"></span>
        ${isA ? `<label class="small" style="margin:0">Asoschi tanlovi (ixtiyoriy):</label><select id="kpi-award" style="width:auto"><option value="">— yo'q —</option>${rankPool().map(p => `<option value="${p.id}" ${awardId === p.id ? "selected" : ""}>${esc(p.full_name)}</option>`).join("")}</select>` : ""}</div>
        <div class="row" style="gap:16px">${win.map((x, i) => `<div class="top-item">${avatar(x.p.full_name, photoOf(x.p))}<div><div class="small muted">${x.picked ? "Asoschi tanlovi" : "Reyting 1-o'rni"} · ${esc(DEPTS[deptOf(x.p)].l)}</div><b>${esc(x.p.full_name)}</b><div class="top-score">${x.final}%</div></div></div>`).join("") || `<span class="muted">Hali ballar qo'yilmagan</span>`}</div>
        ${awardId ? `<p class="small muted" style="margin:10px 0 0">Asoschi tanlagan xodimning bu bosqichdagi barcha ballari 100 qilingan.</p>` : ""}</div>` : ""}
      ${tabBar(tabs, tab)}
      ${tab.id === "administratsiya" ? `<div class="note" style="margin:0 0 12px">Administratsiya uchun hozircha "Umumiy nazorat" mezonlari ishlatilmoqda.</div>` : ""}
      ${tab.id === "ceo" ? `<div class="note" style="margin:0 0 12px">CEO'lar o'z bo'limi mezonlari + "Jamoaning faolligi" (20 ball, hozircha siz qo'yasiz) bo'yicha baholanadi. Jami 120 ball, natija foizda.</div>` : ""}
      <div class="card"><div class="table-wrap">${rows.length ? `<table class="kpi-table"><thead><tr><th>Xodim</th>
          ${items.map(it => `<th title="${esc(it.l + " — " + it.d)}">${esc(it.s)}<div class="kpi-max">${it.max}${it.auto ? " · avto" : ""}</div></th>`).join("")}
          <th>Jami</th><th>Yakuniy</th></tr></thead><tbody>
          ${rows.map(x => `<tr class="${x.picked ? "picked" : ""}"><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(x.p.full_name, photoOf(x.p))}<b>${esc(x.p.full_name)}</b>${x.picked ? " ⭐" : ""}</div></td>
            ${x.cells.map(c => { const ed = !x.picked && canRate(x.p) && (!c.it.ceoOnly || isA);
              const tip = esc([c.au.why, hintFor(x.p, c.it, ps)].filter(Boolean).join(" · "));
              return `<td title="${tip}">${ed ? `<input class="kpi-in ${c.man ? "set" : ""}" type="number" min="0" max="${c.it.max}" step="0.5" data-u="${x.p.id}" data-c="${c.it.k}" data-max="${c.it.max}" value="${c.man && c.man.score !== null ? c.man.score : ""}" placeholder="${c.au.v ?? "—"}">`
                : `<span class="${c.it.auto && !c.man && !x.picked ? "kpi-auto" : ""}">${c.val ?? "—"}</span>`}</td>`; }).join("")}
            <td><b>${x.sum}</b><span class="small muted">/${x.maxT}</span></td>
            <td>${canRate(x.p) && !x.picked ? `<input class="kpi-in kpi-final ${x.overridden ? "set" : ""}" type="number" min="0" max="100" step="0.5" data-fu="${x.p.id}" value="${x.overridden ? x.final : ""}" placeholder="${x.pct}">%` : `<b>${x.final}%</b>`}</td></tr>`).join("")}
          </tbody></table>` : `<div class="empty">Bu bo'limda hali xodim yo'q</div>`}</div>
        ${rows.some(x => canRate(x.p)) ? `<p class="small muted" style="margin:10px 0 0">Kulrang raqam — avtomatik hisoblangan qiymat. Katakka raqam yozsangiz, o'shani qo'yasiz; o'chirsangiz, avtomatikka qaytadi. "Reja" ustuni shaxsiy topshiriqlar va bo'lim eslatmalarining CEO tasdiqlagan bajarilishidan hisoblanadi.</p>` : ""}
      </div>
      <div class="card" style="margin-top:16px"><div class="card-head"><h2>Mezonlar</h2></div>
        <table class="small"><thead><tr><th>Mezon</th><th>Ball</th><th>Kim qo'yadi</th><th class="hide-sm">Nimani o'lchaydi</th></tr></thead><tbody>
        ${items.map(it => `<tr><td>${esc(it.l)}</td><td>${it.max}</td><td>${it.auto ? pill("tasdiqlandi", "Avtomatik") : it.ceoOnly ? pill("", "Asoschi") : pill("jarayonda", "CEO")}</td><td class="hide-sm muted">${esc(it.d)}</td></tr>`).join("")}
        </tbody></table></div>`;
    const rerun = () => kpiBosqich(body);
    $("#kpi-p", body).onchange = e => { S.ui.kpiP = e.target.value; rerun(); };
    bindTabs(body, rerun);
    if ($("#kpi-award", body)) $("#kpi-award", body).onchange = async e => { await act(() => db.setAward(ps, e.target.value || null), e.target.value ? "Asoschi tanlovi belgilandi" : "Tanlov olib tashlandi"); rerun(); };
    $$("[data-c]", body).forEach(inp => inp.onchange = async () => {
      const v = inp.value === "" ? null : Math.max(0, Math.min(+inp.dataset.max, +inp.value));
      await act(() => db.setKpiScore(ps, inp.dataset.u, inp.dataset.c, v), "Saqlandi"); rerun();
    });
    $$("[data-fu]", body).forEach(inp => inp.onchange = async () => {
      const v = inp.value === "" ? null : Math.max(0, Math.min(100, +inp.value));
      await act(() => db.setKpiFinal(ps, inp.dataset.fu, v), "Yakuniy natija saqlandi"); rerun();
    });
  }

  async function kpiShort(body, mode) {
    const t = today();
    const from = mode === "kun" ? (S.ui.kpiDay || t) : (S.ui.kpiWeek || weekOf(t));
    const to = mode === "kun" ? from : addD(from, 6);
    const weeks = []; for (let i = 0; i < 12; i++) weeks.push(addD(weekOf(t), -7 * i));
    const tabs = kpiTabs(); const tab = tabs.find(x => x.id === S.ui.kpiTab) || tabs[0];
    const pct = a => a.r === null ? null : Math.round(a.r * 1000) / 10;
    const rows = tab.rows.map(p => {
      const rj = rangeAuto(p, "reja", from, to), hs = rangeAuto(p, "hisobot", from, to), es = rangeAuto(p, "eslatma", from, to);
      const vals = [pct(rj), pct(hs), pct(es)].filter(v => v !== null);
      return { p, rj, hs, es, avg: vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10 : null };
    }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
    const cell = a => a.r === null ? `<span class="muted">—</span>` : `<span title="${esc(a.why)}">${pct(a)}%</span>`;
    body.innerHTML = `<div class="row" style="margin:14px 0">${mode === "kun"
        ? `<input type="date" id="kpi-day" value="${from}" max="${t}" style="width:auto">`
        : `<select id="kpi-week" style="width:auto">${weeks.map(w => `<option value="${w}" ${w === from ? "selected" : ""}>${fmtDate(w)} – ${fmtDate(addD(w, 6))}${w === weekOf(t) ? " (joriy hafta)" : ""}</option>`).join("")}</select>`}
      <span class="small muted">Avtomatik ko'rsatkichlar: topshiriqlar, kunlik hisobot va bo'lim eslatmalari. To'liq KPI 2 haftalik bosqichda chiqadi.</span></div>
      ${tabBar(tabs, tab)}
      <div class="card"><div class="table-wrap">${rows.length ? `<table class="kpi-table"><thead><tr><th>Xodim</th><th>Reja / topshiriqlar</th><th>Kunlik hisobot</th><th>Eslatmalar</th><th>O'rtacha</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(x.p.full_name, photoOf(x.p))}<b>${esc(x.p.full_name)}</b></div></td><td>${cell(x.rj)}</td><td>${cell(x.hs)}</td><td>${cell(x.es)}</td><td><b>${x.avg ?? "—"}${x.avg !== null ? "%" : ""}</b></td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">Xodim yo'q</div>`}</div></div>`;
    const rerun = () => kpiShort(body, mode);
    if ($("#kpi-day", body)) $("#kpi-day", body).onchange = e => { S.ui.kpiDay = e.target.value; rerun(); };
    if ($("#kpi-week", body)) $("#kpi-week", body).onchange = e => { S.ui.kpiWeek = e.target.value; rerun(); };
    bindTabs(body, rerun);
  }

  async function kpiYear(body) {
    const y = S.ui.kpiYear || today().slice(0, 4);
    const from = `${y}-01-01`, to = `${y}-12-31`, cur = periodOf(today());
    const periods = []; for (let ps = periodOf(from < KPI_ANCHOR ? KPI_ANCHOR : from); ps <= cur && ps <= to; ps = addD(ps, 14)) if (ps >= KPI_ANCHOR) periods.push(ps);
    const [K, aw, reps] = await Promise.all([db.listKpiRange(from, to), db.listAwards(from, to), db.listReports({ from, to })]);
    const tabs = kpiTabs(); const tab = tabs.find(x => x.id === S.ui.kpiTab) || tabs[0];
    const wins = {};
    periods.forEach(ps => { const awardId = aw.find(a => a.period_start === ps)?.user_id;
      winners(rankPool().map(p => kpiRow(p, ps, K, awardId, reps)), awardId).forEach(w => wins[w.p.id] = (wins[w.p.id] || 0) + 1); });
    const rows = tab.rows.map(p => {
      const per = periods.map(ps => kpiRow(p, ps, K, aw.find(a => a.period_start === ps)?.user_id, reps));
      const has = per.filter(x => x.has);
      return { p, per, avg: has.length ? Math.round(has.reduce((a, x) => a + x.final, 0) / has.length * 10) / 10 : null };
    }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
    const years = []; for (let yy = 2026; yy <= +today().slice(0, 4); yy++) years.push(String(yy));
    body.innerHTML = `<div class="row" style="margin:14px 0"><select id="kpi-y" style="width:auto">${years.map(x => `<option ${x === y ? "selected" : ""}>${x}</option>`).join("")}</select>
      <span class="small muted">${periods.length} ta bosqich. O'rtacha — natijasi bor bosqichlar bo'yicha.</span></div>
      ${tabBar(tabs, tab)}
      <div class="card"><div class="table-wrap">${rows.length && periods.length ? `<table class="kpi-table"><thead><tr><th>Xodim</th>${periods.map(ps => `<th title="${periodLabel(ps)}">${bosqichNo(ps)}-b.</th>`).join("")}<th>O'rtacha</th><th>🏆</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(x.p.full_name, photoOf(x.p))}<b>${esc(x.p.full_name)}</b></div></td>
          ${x.per.map(c => `<td>${c.has ? `${c.final}${c.picked ? "⭐" : ""}` : `<span class="muted">—</span>`}</td>`).join("")}
          <td><b>${x.avg ?? "—"}${x.avg !== null ? "%" : ""}</b></td><td>${wins[x.p.id] || ""}</td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">Hali natija yo'q</div>`}</div></div>`;
    const rerun = () => kpiYear(body);
    $("#kpi-y", body).onchange = e => { S.ui.kpiYear = e.target.value; rerun(); };
    bindTabs(body, rerun);
  }

  // ---- Eslatmalar (bo'limlar kesimidagi topshiriqlar)
  PAGES.eslatmalar = page => {
    const r = S.me.role, mgr = isManager();
    const mine = S.dtasks.filter(t => recipientsOf(t).some(p => p.id === S.me.id));
    const list = r === "asoschi" ? S.dtasks : r === "ceo" ? S.dtasks : mine;
    page.innerHTML = head("Eslatmalar", mgr ? "Bir, ikki yoki barcha bo'limga topshiriq-eslatma yuboring. CEO har bir xodim bajarganini tasdiqlaydi — bu KPI'dagi \"Reja\" ballariga ta'sir qiladi." : "Bo'limingizga yuborilgan topshiriq-eslatmalar. Bajarganingizni belgilang — CEO tasdiqlaydi.",
      mgr ? `<button class="btn primary" id="new-dt">+ Yangi eslatma</button>` : "") + `
      <div class="card">${list.length ? list.map(t => {
        const rec = recipientsOf(t);
        const done = rec.filter(p => dtStatus(t, p).status === "bajarildi").length;
        const my = dtStatus(t, S.me);
        const isMine = rec.some(p => p.id === S.me.id);
        const toConfirm = rec.filter(p => canRate(p) && dtStatus(t, p).status === "kutilmoqda" && dtStatus(t, p).self_done).length;
        return `<div class="list-item click" data-dt="${t.id}"><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div>
          <div class="row" style="gap:4px;margin-top:4px">${(t.depts.length === Object.keys(DEPTS).length ? [pill("", "Barcha bo'limlar")] : t.depts.map(d => pill("", DEPTS[d]?.l || d))).join("")}
          <span class="small muted">muddat: ${fmtDue(t.due_date, t.due_time)}</span></div></div>
          <div style="text-align:right">${mgr ? `<div class="small"><b>${done}/${rec.length}</b> bajardi</div>${toConfirm ? pill("jarayonda", toConfirm + " ta tasdiq kutilmoqda") : ""}` : ""}
          ${isMine ? `<div style="margin-top:4px">${pill(DTS_CLS[my.status], my.status === "kutilmoqda" ? (my.self_done ? "Bajardim · tasdiq kutilmoqda" : "Bajarilmagan") : DTS[my.status])}</div>` : ""}</div></div>`;
      }).join("") : `<div class="empty">Hozircha eslatma yo'q</div>`}</div>`;
    if ($("#new-dt", page)) $("#new-dt", page).onclick = () => dtForm();
    $$("[data-dt]", page).forEach(el => el.onclick = () => openDt(+el.dataset.dt || el.dataset.dt));
  };

  function dtForm() {
    const isA = S.me.role === "asoschi";
    const people = isA ? S.profiles.filter(p => p.active && ["ceo", "xodim"].includes(p.role)) : members();
    const m = openModal("Yangi eslatma-topshiriq", `<form id="dtform">
      <div class="field"><label>Nomi *</label><input name="title" required maxlength="200"></div>
      <div class="field"><label>Tavsif</label><textarea name="description"></textarea></div>
      <div class="field"><label>Kimga yuboriladi * <span class="muted">(butun bo'lim yoki alohida xodimlar)</span></label><div id="dt-rp" class="rp"></div></div>
      <div class="field"><label>Qachongacha</label><div id="dt-dl"></div></div>
      <div class="err-text" id="dt-err"></div></form>`, `<button class="btn" data-close>Bekor qilish</button><button class="btn primary" id="dtsave">Yuborish</button>`);
    $(".modal", $("#modal-root")).style.maxWidth = "680px";
    const getRp = recipientPicker($("#dt-rp", m), people);
    const getDl = deadlinePicker($("#dt-dl", m), today(), "18:00");
    $("#dtsave", m).onclick = async () => {
      const f = $("#dtform", m); if (!f.reportValidity()) return;
      const ids = getRp(); if (!ids.length) return ($("#dt-err", m).textContent = "Kamida bitta xodimni tanlang");
      const depts = [...new Set(ids.map(id => deptOf(person(id))))];
      const whole = depts.every(dp => people.filter(p => deptOf(p) === dp).every(p => ids.includes(p.id)));
      await act(() => db.createDeptTask({ title: f.title.value.trim(), description: f.description.value.trim(), ...getDl(), depts, recipients: whole && isA ? null : ids }), "Eslatma yuborildi");
      await refresh(); render();
    };
  }

  function openDt(id) {
    const t = S.dtasks.find(x => x.id === id); if (!t) return;
    const rec = recipientsOf(t).filter(p => S.me.role === "asoschi" || p.id === S.me.id || canRate(p));
    const isMine = recipientsOf(t).some(p => p.id === S.me.id);
    const my = dtStatus(t, S.me);
    const m = openModal(esc(t.title), `
      ${t.description ? `<p style="white-space:pre-wrap;margin-top:0">${esc(t.description)}</p>` : ""}
      <p class="small muted">Muddat: ${fmtDue(t.due_date, t.due_time)} · Yuborgan: ${esc(nameOf(t.created_by))}</p>
      ${isMine ? `<div class="card" style="margin-bottom:14px;padding:12px"><b>Mening holatim:</b> ${pill(DTS_CLS[my.status], my.status === "kutilmoqda" ? (my.self_done ? "Bajardim · tasdiq kutilmoqda" : "Bajarilmagan") : DTS[my.status])}
        ${my.status !== "bajarildi" ? `<div class="field" style="margin:10px 0 6px"><textarea id="dt-note" placeholder="Qisqa izoh (ixtiyoriy)" style="min-height:50px">${esc(my.self_note || "")}</textarea></div>
        <button class="btn primary sm" id="dt-self">${my.self_done ? "Izohni yangilash" : "Bajardim"}</button>` : ""}</div>` : ""}
      ${rec.filter(p => p.id !== S.me.id).length ? `<table class="small"><thead><tr><th>Xodim</th><th>Xodim belgisi</th><th>Tasdiq</th></tr></thead><tbody>
        ${rec.filter(p => p.id !== S.me.id).map(p => { const st = dtStatus(t, p); return `<tr><td><b>${esc(p.full_name)}</b><div class="muted">${esc(DEPTS[deptOf(p)].l)}</div></td>
          <td>${st.self_done ? `✅ Bajardim${st.self_note ? `<div class="muted">${esc(st.self_note)}</div>` : ""}` : `<span class="muted">—</span>`}</td>
          <td style="white-space:nowrap">${canRate(p) ? `<button class="btn sm ${st.status === "bajarildi" ? "ok" : ""}" data-cf="${p.id}" data-st="bajarildi">✓ Bajarildi</button> <button class="btn sm ${st.status === "bajarilmadi" ? "bad" : ""}" data-cf="${p.id}" data-st="bajarilmadi">✗ Yo'q</button>` : pill(DTS_CLS[st.status], DTS[st.status])}</td></tr>`; }).join("")}
        </tbody></table>` : ""}`,
      `${S.me.role === "asoschi" || t.created_by === S.me.id ? `<button class="btn sm bad" id="dt-del">O'chirish</button>` : ""}<span class="spacer"></span><button class="btn" data-close>Yopish</button>`);
    $(".modal", $("#modal-root")).style.maxWidth = "720px";
    const reopen = async () => { await refresh(); render(); openDt(id); };
    if ($("#dt-self", m)) $("#dt-self", m).onclick = async () => { await act(() => db.setDeptStatus(t.id, S.me.id, { self_done: true, self_note: $("#dt-note", m).value.trim() }), "Belgilandi — CEO tasdiqlaydi"); reopen(); };
    $$("[data-cf]", m).forEach(b => b.onclick = async () => { await act(() => db.setDeptStatus(t.id, b.dataset.cf, { status: b.dataset.st }), "Saqlandi"); reopen(); });
    if ($("#dt-del", m)) $("#dt-del", m).onclick = async e => {
      if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Rostdan o'chirilsinmi?"; return; }
      await act(() => db.deleteDeptTask(t.id), "O'chirildi"); await refresh(); render();
    };
  }

  // ---- Topshiriqlar statistikasi (bajarildi / bajarilmadi)
  function itemsOfPerson(p, from, to) {
    const out = [];
    S.tasks.filter(x => x.assigned_to === p.id).forEach(x => {
      const d = x.due_date || localOf(x.created_at); if (!inDays(d, from, to)) return;
      const st = x.status === "yopildi" ? "done" : x.status === "bajarildi" ? "review" : dueOver(x.due_date, x.due_time) ? "failed" : "progress";
      out.push({ kind: "Topshiriq", title: x.title, d, tm: x.due_time, st });
    });
    S.dtasks.forEach(x => {
      const d = dtDate(x); if (!inDays(d, from, to) || !recipientsOf(x).some(r => r.id === p.id)) return;
      const ds = dtStatus(x, p);
      const st = ds.status === "bajarildi" ? "done" : ds.status === "bajarilmadi" ? "failed" : ds.self_done ? "review" : dueOver(x.due_date, x.due_time) ? "failed" : "progress";
      out.push({ kind: "Eslatma", title: x.title, d, tm: x.due_time, st });
    });
    return out;
  }
  const ST_L = { done: "Bajarildi", review: "Tekshiruvda", progress: "Jarayonda", failed: "Bajarilmadi" };
  const ST_C = { done: "tasdiqlandi", review: "bajarildi", progress: "jarayonda", failed: "qaytarildi" };
  function countSt(items) { const c = { total: items.length, done: 0, review: 0, progress: 0, failed: 0 }; items.forEach(i => c[i.st]++); c.pct = c.total ? Math.round(c.done / c.total * 100) : null; return c; }
  const bar = c => c.total ? `<div class="stbar" title="Bajarildi ${c.done}, tekshiruvda ${c.review}, jarayonda ${c.progress}, bajarilmadi ${c.failed}">
    ${["done", "review", "progress", "failed"].map(k => c[k] ? `<i class="sb-${k}" style="width:${c[k] / c.total * 100}%"></i>` : "").join("")}</div>` : `<span class="muted small">—</span>`;

  PAGES.statistika = page => {
    const t = today();
    const ranges = {
      hafta: ["Bu hafta", weekOf(t), addD(weekOf(t), 6)],
      bosqich: [`Joriy bosqich (${bosqichNo(periodOf(t))}-bosqich)`, periodOf(t), addD(periodOf(t), 13)],
      oy: ["Bu oy", t.slice(0, 8) + "01", t.slice(0, 8) + "31"],
      otgan: ["O'tgan oy", (() => { const d = new Date(t + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1); return window.dateUtil.localDate(d); })(), (() => { const d = new Date(t + "T12:00:00"); d.setDate(0); return window.dateUtil.localDate(d); })()],
      hammasi: ["Hammasi", "2000-01-01", "2100-01-01"]
    };
    const rk = S.ui.stR || "bosqich"; const [, from, to] = ranges[rk];
    const r = S.me.role;
    const people = r === "asoschi" ? S.profiles.filter(p => p.active && ["ceo", "xodim"].includes(p.role)) : r === "ceo" ? [S.me, ...members()] : [S.me];
    const rows = people.map(p => { const it = itemsOfPerson(p, from, to); return { p, it, c: countSt(it) }; });
    const all = countSt(rows.flatMap(x => x.it));
    const byDept = {};
    rows.forEach(x => { const k = x.p.role === "ceo" && r === "asoschi" ? "ceo" : deptOf(x.p); (byDept[k] = byDept[k] || []).push(x); });
    rows.sort((a, b) => (b.c.pct ?? -1) - (a.c.pct ?? -1) || b.c.total - a.c.total);
    page.innerHTML = head("Statistika", "Topshiriq va eslatmalarning bajarilishi: bajarildi, tekshiruvda, jarayonda, bajarilmadi.",
      `<select id="st-r" style="width:auto">${Object.entries(ranges).map(([k, [l]]) => `<option value="${k}" ${k === rk ? "selected" : ""}>${l}</option>`).join("")}</select>`) + `
      <div class="stats st5">
        ${stat("Jami", all.total)}${stat("Bajarildi", all.done, "ok")}${stat("Tekshiruvda", all.review)}${stat("Jarayonda", all.progress, "warn")}${stat("Bajarilmadi", all.failed, all.failed ? "bad" : "ok")}
      </div>
      ${r !== "xodim" ? `<div class="card"><div class="card-head"><h2>Bo'limlar kesimida</h2><span class="spacer"></span><span class="legend small"><i class="sb-done"></i>bajarildi <i class="sb-review"></i>tekshiruvda <i class="sb-progress"></i>jarayonda <i class="sb-failed"></i>bajarilmadi</span></div>
        <div class="table-wrap"><table><thead><tr><th>Bo'lim</th><th>Jami</th><th>Bajarildi</th><th>Bajarilmadi</th><th>Bajarilish</th><th style="width:30%"></th></tr></thead><tbody>
        ${Object.entries(byDept).map(([k, list]) => { const c = countSt(list.flatMap(x => x.it));
          return `<tr><td><b>${esc(k === "ceo" ? "CEO'lar" : DEPTS[k]?.l || k)}</b></td><td>${c.total}</td><td>${c.done}</td><td>${c.failed ? pill("overdue", c.failed) : 0}</td><td><b>${c.pct ?? "—"}${c.pct !== null ? "%" : ""}</b></td><td>${bar(c)}</td></tr>`; }).join("")}
        </tbody></table></div></div>` : ""}
      <div class="card" style="margin-top:16px"><div class="card-head"><h2>${r === "xodim" ? "Mening topshiriqlarim" : "Xodimlar kesimida"}</h2></div>
        <div class="table-wrap"><table><thead><tr><th>Xodim</th><th class="hide-sm">Bo'lim</th><th>Jami</th><th>✓</th><th class="hide-sm">Tekshiruvda</th><th class="hide-sm">Jarayonda</th><th>✗</th><th>%</th><th style="width:22%" class="hide-sm"></th></tr></thead><tbody>
        ${rows.map(x => `<tr class="click" data-sp="${x.p.id}"><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(x.p.full_name, photoOf(x.p))}<b>${esc(x.p.full_name)}</b></div></td>
          <td class="hide-sm small">${esc(DEPTS[deptOf(x.p)].l)}</td><td>${x.c.total}</td><td>${x.c.done}</td><td class="hide-sm">${x.c.review}</td><td class="hide-sm">${x.c.progress}</td>
          <td>${x.c.failed ? pill("overdue", x.c.failed) : 0}</td><td><b>${x.c.pct ?? "—"}</b></td><td class="hide-sm">${bar(x.c)}</td></tr>`).join("")}
        </tbody></table></div></div>`;
    $("#st-r", page).onchange = e => { S.ui.stR = e.target.value; PAGES.statistika(page); };
    $$("[data-sp]", page).forEach(tr => tr.onclick = () => {
      const x = rows.find(y => y.p.id === tr.dataset.sp); if (!x) return;
      const order = { failed: 0, review: 1, progress: 2, done: 3 };
      openModal(`${esc(x.p.full_name)} — ${esc(ranges[rk][0].toLowerCase())}`, x.it.length ? x.it.sort((a, b) => order[a.st] - order[b.st] || (a.d < b.d ? -1 : 1)).map(i =>
        `<div class="list-item"><div style="flex:1"><div class="t">${esc(i.title)}</div><div class="small muted">${i.kind} · ${fmtDue(i.d, i.tm)}</div></div>${pill(ST_C[i.st], ST_L[i.st])}</div>`).join("") : `<div class="empty">Bu davrda topshiriq yo'q</div>`);
    });
  };

  // ---- Haftalik reja va hafta jamlanmasi
  PAGES.reja = async page => {
    const t = today(); const ws = S.ui.week || weekOf(t); const we = addD(ws, 6);
    const weeks = []; for (let i = -1; i < 10; i++) weeks.push(addD(weekOf(t), -7 * i));
    const r = S.me.role;
    const people = r === "asoschi" ? S.profiles.filter(p => p.active && ["ceo", "xodim"].includes(p.role)) : r === "ceo" ? [S.me, ...members()] : [S.me];
    page.innerHTML = head("Haftalik reja", isManager() ? "Har bir xodimning haftalik rejasini kiriting. Hafta oxirida rejaga qarshi hisobotlar shu yerda jamlanadi." : "CEO kiritgan haftalik rejangiz va hafta jamlanmasi.",
      `<select id="wk" style="width:auto">${weeks.map(w => `<option value="${w}" ${w === ws ? "selected" : ""}>${fmtDate(w)} – ${fmtDate(addD(w, 6))}${w === weekOf(t) ? " (joriy)" : ""}</option>`).join("")}</select>`) + `<div class="card empty">Yuklanmoqda…</div>`;
    $("#wk", page).onchange = e => { S.ui.week = e.target.value; PAGES.reja(page); };
    let plans = []; try { plans = await db.listPlans(ws, ws); } catch (e) {}
    const groups = {};
    people.forEach(p => { const k = r === "asoschi" ? (p.role === "ceo" ? "CEO'lar" : DEPTS[deptOf(p)].l) : (p.id === S.me.id ? "Men" : "Jamoam"); (groups[k] = groups[k] || []).push(p); });
    const weekEnd = ["5", "6", "7"].includes(String(tashNow().dow)) && ws === weekOf(t);
    const cardHtml = Object.entries(groups).map(([g, list]) => `<div class="card" style="margin-top:16px"><div class="card-head"><h2>${esc(g)}</h2></div><div class="table-wrap"><table class="plan-table"><thead><tr><th>Xodim</th><th>Haftalik reja</th><th>Hafta jamlanmasi</th></tr></thead><tbody>
      ${list.map(p => { const pl = plans.find(x => x.user_id === p.id);
        const hs = rangeAuto(p, "hisobot", ws, we), rj = rangeAuto(p, "reja", ws, we);
        const reps = S.reports.filter(x => x.author_id === p.id && inDays(x.report_date, ws, we));
        return `<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(p.full_name, photoOf(p))}<div><b>${esc(p.full_name)}</b><div class="small muted">${esc(sched(p).label)}</div></div></div></td>
          <td style="min-width:260px">${canRate(p) ? `<textarea class="plan-in" data-pu="${p.id}" placeholder="Masalan: 5 ta dars kuzatuvi, 2 ta filialga tashrif…">${esc(pl?.plan || "")}</textarea>` : `<div style="white-space:pre-wrap">${esc(pl?.plan || "") || `<span class="muted">Reja kiritilmagan</span>`}</div>`}</td>
          <td class="small" style="min-width:200px">Hisobotlar: <b>${reps.length}</b>${hs.r !== null ? ` (${Math.round(hs.r * 100)}%)` : ""}<br>Topshiriq/eslatma: ${rj.r !== null ? `<b>${Math.round(rj.r * 100)}%</b>` : "—"}
            ${reps.length ? `<br><button class="btn sm" data-wr="${p.id}" style="margin-top:6px">Hisobotlarni ko'rish</button>` : ""}</td></tr>`; }).join("")}
      </tbody></table></div></div>`).join("");
    page.innerHTML = head("Haftalik reja", isManager() ? "Har bir xodimning haftalik rejasini kiriting. Hafta oxirida rejaga qarshi hisobotlar shu yerda jamlanadi." : "CEO kiritgan haftalik rejangiz va hafta jamlanmasi.",
      `<select id="wk" style="width:auto">${weeks.map(w => `<option value="${w}" ${w === ws ? "selected" : ""}>${fmtDate(w)} – ${fmtDate(addD(w, 6))}${w === weekOf(t) ? " (joriy)" : ""}</option>`).join("")}</select>`) +
      (weekEnd && isManager() ? `<div class="note" style="margin:0 0 4px">📋 Hafta yakunlanmoqda — quyida har bir xodimning rejasi va shu haftadagi hisobotlari jamlangan.</div>` : "") + cardHtml;
    $("#wk", page).onchange = e => { S.ui.week = e.target.value; PAGES.reja(page); };
    $$("[data-pu]", page).forEach(ta => ta.onchange = async () => { await act(() => db.setPlan(ta.dataset.pu, ws, ta.value.trim()), "Reja saqlandi"); });
    $$("[data-wr]", page).forEach(b => b.onclick = () => {
      const p = person(b.dataset.wr) || S.me;
      const reps = S.reports.filter(x => x.author_id === p.id && inDays(x.report_date, ws, we)).sort((a, c) => a.report_date < c.report_date ? -1 : 1);
      const pl = plans.find(x => x.user_id === p.id);
      openModal(`${esc(p.full_name)} — hafta jamlanmasi`, `${pl?.plan ? `<div class="note" style="margin-top:0"><b>Reja:</b>\n${esc(pl.plan)}</div>` : ""}
        ${reps.map(x => `<div class="list-item"><div style="flex:1"><div class="row"><b>${fmtDate(x.report_date)}</b>${pill(x.status, RSTAT[x.status])}<span class="small muted">${esc(x.hours)} soat</span></div>
          <div style="white-space:pre-wrap;margin-top:4px">${esc(x.done)}</div>${x.problems ? `<div class="small muted" style="white-space:pre-wrap">Muammo: ${esc(x.problems)}</div>` : ""}</div></div>`).join("")}`);
      $(".modal", $("#modal-root")).style.maxWidth = "720px";
    });
  };

  // ---- Xodimlar / Jamoam
  PAGES.xodimlar = page => (S.me.role === "asoschi" ? usersAdmin : myTeam)(page);

  function usersAdmin(page) {
    const rf = S.ui.urole || "";
    const list = S.profiles.filter(p => !rf || p.role === rf).sort((a, b) =>
      ["kutilmoqda", "asoschi", "ceo", "xodim", "rahbar", "oqituvchi"].indexOf(a.role) - ["kutilmoqda", "asoschi", "ceo", "xodim", "rahbar", "oqituvchi"].indexOf(b.role) || (a.full_name || "").localeCompare(b.full_name || ""));

      <div id="import-box"></div>

      <div class="card"><div class="table-wrap"><table><thead><tr><th>Ism</th><th>Rol</th><th class="hide-sm">Jamoa (CEO)</th><th class="hide-sm">Holat</th><th></th></tr></thead><tbody>
        ${list.map(p => `<tr><td><div class="row" style="gap:10px;flex-wrap:nowrap">${avatar(p.full_name, photoOf(p))}<div><b>${esc(p.full_name || "—")}</b><div class="small muted">${p.role === "oqituvchi" ? "Filial: " + esc(p.filial || "—") : esc(loginOf(p))}${p.position ? " · " + esc(p.position) : ""}</div></div></div></td>

    renderImport($("#import-box", page));

  async function renderImport(box) {
    const rows = await db.listStaffImport().catch(() => []);
    if (!rows.length) return (box.innerHTML = "");
    box.innerHTML = `<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Ro'yxatdagi ${rows.length} ta xodim hali portalga qo'shilmagan</h2></div>
      <p class="small muted" style="margin-top:0">Login — telefon raqami, boshlang'ich parol — tug'ilgan sanasi (kun, oy, yil). Xodimlar parolni "Profilim" bo'limida o'zgartira oladi.</p>
      <div class="table-wrap"><table><thead><tr><th>Ism</th><th>Rol</th><th class="hide-sm">Rahbari</th><th>Login (telefon)</th><th>Parol</th><th id="imp-h"></th></tr></thead><tbody>
      ${rows.map(r => `<tr data-imp="${r.id}"><td><b>${esc(r.full_name)}</b><div class="small muted">${esc(r.position || "")}</div></td><td>${esc(ROLES[r.role] || r.role)}</td>
        <td class="hide-sm small">${r.role === "ceo" ? "—" : esc(rows.find(x => x.phone === r.ceo_phone)?.full_name || S.profiles.find(x => x.phone === r.ceo_phone)?.full_name || "Shaxsiy bo'limim")}</td>
        <td>${esc(fmtPhone(r.phone))}</td><td><code>${esc(pwFromBirth(r.birth_date))}</code></td><td class="imp-st small"></td></tr>`).join("")}
      </tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="imp-go">Hammasiga hisob ochish (${rows.length})</button><span class="small muted" id="imp-msg"></span></div></div>`;
    $("#imp-go", box).onclick = async e => {
      e.target.disabled = true;
      let okN = 0;
      const byPhone = {}; S.profiles.forEach(p => { if (p.phone) byPhone[p.phone] = p.id; });
      rows.sort((a, b) => (a.role === "ceo" ? 0 : 1) - (b.role === "ceo" ? 0 : 1));
      for (const r of rows) {
        const cell = $(`[data-imp="${r.id}"] .imp-st`, box); cell.textContent = "…";
        try {
          const created = await db.createUser({ login: r.phone, password: pwFromBirth(r.birth_date), full_name: r.full_name, role: r.role,
            ceo_id: r.role === "xodim" && r.ceo_phone ? (byPhone[r.ceo_phone] || null) : null, bolim: r.bolim || "",

          if (created?.id) byPhone[r.phone] = created.id;
          await db.markImported(r.id); cell.innerHTML = pill("tasdiqlandi", "Ochildi"); okN++;
        } catch (err) {
          if (/allaqachon/.test(err.message)) { await db.markImported(r.id).catch(() => {}); cell.innerHTML = pill("", "Oldin ochilgan"); }
          else { cell.innerHTML = pill("missing", "Xato"); cell.title = err.message; $("#imp-msg", box).textContent = err.message; if (/kutib/.test(err.message)) break; }
        }
        await new Promise(res => setTimeout(res, 700));
      }
      toast(`${okN} ta hisob ochildi`);
      await refresh(); render();
    };
  }

      if (u) {
        await act(() => db.updateProfile(u.id, { full_name: d.full_name, role: d.role, ceo_id: d.ceo_id, active: !!f.active.checked,
          position: d.position, work_hours: d.work_hours, birth_date: d.birth_date || null, start_date: d.start_date || null, bolim: d.role === "ceo" ? d.bolim : (u.bolim || "") }), "Saqlandi");
      } else {
        const pw = pwFromBirth(d.birth_date);
        await act(() => db.createUser({ login: d.login, password: pw, full_name: d.full_name, role: d.role, ceo_id: d.ceo_id,
          phone: phoneDigits(d.login), birth_date: d.birth_date, position: d.position, work_hours: d.work_hours, start_date: d.start_date || null }),
          `Yaratildi. Login: ${fmtPhone(d.login)}, parol: ${pw}`);
      }
      await refresh(); render();
    };
  }

  function myTeam(page) {
    const mem = members();
    page.innerHTML = head("Jamoam", `${mem.length} ta xodim. Yangi xodim qo'shish yoki o'zgartirish uchun asoschiga murojaat qiling.`) + `
      <div class="card"><div class="table-wrap">${mem.length ? `<table><thead><tr><th>Xodim</th><th class="hide-sm">Aloqa</th><th>Faol topshiriq</th><th>Oxirgi hisobot</th></tr></thead><tbody>
        ${mem.map(p => {
          const last = S.reports.filter(x => x.author_id === p.id).sort((a, b) => a.report_date < b.report_date ? 1 : -1)[0];
          const act = S.tasks.filter(x => x.assigned_to === p.id && ACTIVE_T.includes(x.status)).length;
          return `<tr class="click" data-info="${p.id}"><td><div class="row" style="gap:10px;flex-wrap:nowrap">${avatar(p.full_name, photoOf(p))}<b>${esc(p.full_name)}</b></div></td><td class="hide-sm small">${esc(loginOf(p))}${p.position ? "<br>" + esc(p.position) : ""}</td><td>${act}</td>
            <td>${last ? fmtDate(last.report_date) + " " + pill(last.status, RSTAT[last.status]) : pill("missing", "Yo'q")}</td></tr>`;
        }).join("")}</tbody></table>` : `<div class="empty">Jamoangizga hali xodim biriktirilmagan</div>`}</div></div>`;
    $$("[data-info]", page).forEach(r => r.onclick = () => infoModal(person(r.dataset.info)));
  }

  // ---- Men haqimda
  PAGES["men-haqimda"] = page => {
    const a = S.about || {};
    page.innerHTML = head("Men haqimda", "", S.me.role === "asoschi" ? `<button class="btn" id="edit-about">Tahrirlash</button>` : "") + `
      <div class="card"><div class="about-full">${avatar(a.full_name, a.photo_url, "lg")}<div style="flex:1">
        <h2 style="font-size:22px">${esc(a.full_name || "")}</h2><div class="muted">${esc(a.title || "")}</div>
        ${a.bio ? `<div class="bio">${esc(a.bio)}</div>` : ""}
        <div class="row" style="margin-top:14px">
          ${a.website ? `<a class="btn sm" href="${esc(a.website)}" target="_blank" rel="noopener">Shaxsiy sayt</a>` : ""}
          ${a.telegram ? `<a class="btn sm" href="https://t.me/${esc(String(a.telegram).replace(/^@/, ""))}" target="_blank" rel="noopener">Telegram</a>` : ""}
          ${a.phone ? `<a class="btn sm" href="tel:${esc(a.phone)}">${esc(a.phone)}</a>` : ""}
        </div></div></div></div>`;
    const b = $("#edit-about"); if (!b) return;
    b.onclick = () => {
      const m = openModal("Men haqimda — tahrirlash", `<form id="aform">
        <div class="grid2"><div class="field"><label>Ism</label><input name="full_name" value="${esc(a.full_name)}"></div>
        <div class="field"><label>Lavozim</label><input name="title" value="${esc(a.title)}"></div></div>
        <div class="field"><label>O'zim haqimda</label><textarea name="bio" style="min-height:120px">${esc(a.bio)}</textarea></div>
        <div class="grid2"><div class="field"><label>Telefon</label><input name="phone" value="${esc(a.phone)}"></div>
        <div class="field"><label>Telegram</label><input name="telegram" placeholder="@username" value="${esc(a.telegram)}"></div></div>
        <div class="field"><label>Shaxsiy sayt</label><input name="website" type="url" value="${esc(a.website)}"></div>
        <div class="field"><label>Rasm havolasi (URL)</label><input name="photo_url" type="url" value="${esc(a.photo_url)}"></div></form>`,
        `<button class="btn" data-close>Bekor qilish</button><button class="btn primary" id="asave">Saqlash</button>`);
      $("#asave", m).onclick = async () => {
        await act(() => db.saveAbout(Object.fromEntries(new FormData($("#aform", m)))), "Saqlandi");
        await refresh(); render();
      };
    };
  };

  // ---- Profil
  PAGES.profil = page => {
    if (S.me.role === "oqituvchi") {
      page.innerHTML = head("Profilim", "O'qituvchi") + `<div class="card" style="max-width:520px"><form id="tpf">
        <div class="field"><label>Ism-familiya</label><input name="full_name" required value="${esc(S.me.full_name)}"></div>
        <div class="field"><label>Filial</label><input name="filial" required value="${esc(S.me.filial)}"></div>
        <button class="btn primary">Saqlash</button></form>
        <p class="small muted" style="margin-top:18px">Portal sizni shu qurilmada eslab qolgan. Boshqa odamning qurilmasidan kirgan bo'lsangiz, chiqib keting.</p>
        <button class="btn sm" id="t-out">${ic("out", 16)} Chiqish</button></div>`;
      $("#tpf").onsubmit = async e => {
        e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
        await act(() => db.updateProfile(S.me.id, d), "Saqlandi"); await refresh(); render();
      };
      $("#t-out").onclick = async () => { await db.signOut(); S.me = null; location.hash = ""; render(); };
      return;
    }
    page.innerHTML = head("Profilim", `${esc(ROLES[S.me.role])}${S.me.ceo_id ? " · " + esc(nameOf(S.me.ceo_id)) + " jamoasi" : ""}`) + `
      <div class="cols"><div class="card"><div class="card-head"><h2>Ma'lumotlarim</h2></div><form id="pf">
        <div class="field"><label>To'liq ism</label><input name="full_name" required value="${esc(S.me.full_name)}"></div>
        <div class="field"><label>Telefon</label><input name="phone" value="${esc(S.me.phone)}"></div>
        <div class="field"><label>Login</label><input value="${esc(loginOf(S.me))}" disabled></div>
        ${S.me.position || S.me.work_hours || S.me.birth_date ? `<p class="small muted">${S.me.position ? esc(S.me.position) + "<br>" : ""}${S.me.work_hours ? "Ish vaqti: " + esc(S.me.work_hours) + "<br>" : ""}${S.me.birth_date ? "Tug'ilgan sana: " + fmtBirth(S.me.birth_date) : ""}</p>` : ""}
        <button class="btn primary">Saqlash</button></form></div>
      <div class="card"><div class="card-head"><h2>Parolni o'zgartirish</h2></div><form id="pw">
        <div class="field"><label>Yangi parol</label><input type="password" name="p1" minlength="6" required autocomplete="new-password"></div>
        <div class="field"><label>Yangi parolni takrorlang</label><input type="password" name="p2" minlength="6" required autocomplete="new-password"></div>
        <button class="btn">Parolni yangilash</button></form></div></div>
      ${S.info[S.me.phone] ? `<div class="card" style="margin-top:16px"><div class="card-head"><h2>Mening ma'lumotnomam</h2></div>
        <div class="about-full"><img class="staff-photo" src="${photoOf(S.me)}" alt=""><div style="flex:1;min-width:0"><div class="info-lines">${esc(S.info[S.me.phone].details)}</div></div></div>
        ${S.info[S.me.phone].bio ? `<h3 style="margin-top:16px">Umumiy ma'lumot</h3><p style="white-space:pre-wrap;margin-top:6px">${esc(S.info[S.me.phone].bio)}</p>` : ""}</div>` : ""}`;
    $("#pf").onsubmit = async e => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
      await act(() => db.updateProfile(S.me.id, d), "Saqlandi"); await refresh(); render();
    };
    $("#pw").onsubmit = async e => {
      e.preventDefault(); const { p1, p2 } = Object.fromEntries(new FormData(e.target));
      if (p1 !== p2) return toast("Parollar mos emas", true);
      await act(() => db.changePassword(p1), "Parol yangilandi"); e.target.reset();
    };
  };

  // ---- 2-bosqich bo'limlari
  const soon = (title, byRole) => page => {
    const txt = byRole[S.me.role] || byRole.default;
    page.innerHTML = head(title, "") + `<div class="card"><div class="row">${pill("yangi", "2-bosqichda qo'shiladi")}</div>
      <p style="margin-bottom:0">${txt}</p></div>`;
  };
  // ---- Videolar
  const AUD = { rahbar: "Rahbarlar", oqituvchi: "O'qituvchilar", xodim: "Xodimlar", ceo: "CEO'lar" };
  const ytId = u => { const m = String(u || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; };
  function videoCard(v) {
    const yt = v.kind === "youtube" && ytId(v.url);
    return `<button class="video-card" data-video="${v.id}">
      <div class="video-thumb">${yt ? `<img src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : ""}<span class="play">▶</span></div>
      <div class="video-meta"><div class="t">${esc(v.title)}</div>
      ${v.description ? `<div class="small muted">${esc(v.description.length > 90 ? v.description.slice(0, 90) + "…" : v.description)}</div>` : ""}
      ${S.me.role === "asoschi" ? `<div class="row" style="gap:4px;margin-top:6px">${v.audience.map(a => pill("", AUD[a] || a)).join("")}</div>` : ""}</div></button>`;
  }
  const bindVideoCards = root => $$("[data-video]", root).forEach(el => el.onclick = () => openVideo(+el.dataset.video || el.dataset.video));

  PAGES.videolar = page => {
    const isA = S.me.role === "asoschi";
    page.innerHTML = head("Videolar va maqolalar", isA ? "Har bir video kimga ko'rinishini o'zingiz belgilaysiz." : "Siz uchun tayyorlangan uslubiy materiallar.",
      isA ? `<button class="btn primary" id="new-video">+ Video qo'shish</button>` : "") +
      (S.videos.length ? `<div class="video-grid">${S.videos.map(videoCard).join("")}</div>` : `<div class="card empty">Hozircha video yo'q</div>`);
    if (isA) $("#new-video").onclick = () => videoForm();
    bindVideoCards(page);
  };

  function videoForm() {
    const m = openModal("Video qo'shish", `<form id="vform">
      <div class="field"><label>Nomi *</label><input name="title" required maxlength="200"></div>
      <div class="field"><label>Qisqacha tavsif</label><textarea name="description"></textarea></div>
      <div class="field"><label>Manba</label><select name="kind" id="v-kind">
        <option value="file">Kompyuterdan fayl yuklash (50 MB gacha)</option><option value="youtube">YouTube havolasi</option><option value="link">Boshqa havola (Google Drive va h.k.)</option></select></div>
      <div class="field" id="v-file"><label>Video fayl</label><input type="file" name="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.webm"></div>
      <div class="field" id="v-url" style="display:none"><label>Havola</label><input type="url" name="url" placeholder="https://"></div>
      <label>Kimga ko'rinsin</label>
      <div class="row" style="margin-bottom:6px">${Object.entries(AUD).map(([k, l]) => `<label style="display:flex;gap:6px;align-items:center;color:var(--text);font-weight:500;margin:0"><input type="checkbox" name="aud" value="${k}" style="width:auto" ${["rahbar", "oqituvchi"].includes(k) ? "checked" : ""}> ${l}</label>`).join("")}</div>
      <div class="err-text" id="v-err"></div>
    </form>`, `<button class="btn" data-close>Bekor qilish</button><button class="btn primary" id="vsave">Saqlash</button>`);
    const sync = () => { const k = $("#v-kind", m).value; $("#v-file", m).style.display = k === "file" ? "" : "none"; $("#v-url", m).style.display = k === "file" ? "none" : ""; };
    $("#v-kind", m).onchange = sync;
    $("#vsave", m).onclick = async e => {
      const f = $("#vform", m); if (!f.reportValidity()) return;
      const kind = f.kind.value, file = f.file.files[0], url = f.url.value.trim();
      const audience = $$("[name=aud]:checked", m).map(x => x.value);
      if (!audience.length) return ($("#v-err", m).textContent = "Kamida bitta rolni tanlang");
      if (kind === "file" && !file) return ($("#v-err", m).textContent = "Video faylni tanlang");
      if (kind === "file" && file.size > 50 * 1024 * 1024) return ($("#v-err", m).textContent = "Fayl 50 MB dan katta. Videoni YouTube'ga (ro'yxatsiz) yuklab, havolasini qo'ying.");
      if (kind !== "file" && !url) return ($("#v-err", m).textContent = "Havolani kiriting");
      e.target.disabled = true; e.target.textContent = kind === "file" ? "Yuklanmoqda…" : "Saqlanmoqda…";
      try {
        await act(() => db.createVideo({ title: f.title.value.trim(), description: f.description.value.trim(), kind, url, file: kind === "file" ? file : null, audience }), "Video qo'shildi");
        await refresh(); render();
      } catch (err) { e.target.disabled = false; e.target.textContent = "Saqlash"; $("#v-err", m).textContent = err.message; }
    };
  }

  async function openVideo(id) {
    const v = S.videos.find(x => x.id === id); if (!v) return;
    const m = openModal(esc(v.title), `<div id="v-player" class="video-player"><div class="empty">Yuklanmoqda…</div></div>
      ${v.description ? `<p style="white-space:pre-wrap">${esc(v.description)}</p>` : ""}
      ${S.me.role === "asoschi" ? `<div class="row small muted">Ko'radi: ${v.audience.map(a => pill("", AUD[a] || a)).join("")}</div>` : ""}`,
      S.me.role === "asoschi" ? `<button class="btn sm bad" id="v-del">O'chirish</button>` : "");
    $(".modal", $("#modal-root")).style.maxWidth = "820px";
    try {
      const yt = v.kind === "youtube" && ytId(v.url);
      const box = $("#v-player", m);
      if (yt) box.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
      else if (v.kind === "file") box.innerHTML = `<video controls playsinline preload="metadata" src="${esc(await db.videoUrl(v))}"></video>`;
      else box.innerHTML = `<div class="empty"><a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener">Videoni ochish ↗</a></div>`;
    } catch (err) { $("#v-player", m).innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
    const d = $("#v-del", m);
    if (d) d.onclick = async e => {
      if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Rostdan o'chirilsinmi?"; return; }
      await act(() => db.deleteVideo(v), "O'chirildi"); await refresh(); render();
    };
  }

  PAGES.savollar = soon("Savol-javob", {
    rahbar: "Monitoring bo'limiga savol yuborasiz va javobni shu yerda olasiz.",
    oqituvchi: "Monitoringga savol yuborasiz (xohlasangiz, ismsiz) va javobni shu yerda ko'rasiz.",
    default: "Rahbarlar va o'qituvchilardan kelgan savollar shu yerda yig'iladi va javob beriladi."
  });
  PAGES.uchrashuvlar = soon("Zoom uchrashuvlar", {
    rahbar: "Monitoring bo'limi bilan Zoom uchrashuvini shu yerdan belgilaysiz.",
    default: "Rahbarlar bilan Zoom uchrashuvlarini rejalashtirish va havolalarni yuborish shu yerda bo'ladi."
  });

  // ---------------------------------------------------------- start
  (async function start() {
    try { S.me = await db.restore(); if (S.me) await refresh(); }
    catch (e) { S.me = null; }
    render();
  })();
})();

</script>
</body>
</html>
